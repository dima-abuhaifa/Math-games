<style>
/* Lesson map -> one lesson at a time. The real book page is always on screen; answers are hand-written into its blanks. */
:root{
  --bg:#EEF6FF; --paper:#FFFFFF; --ink:#1D2B4F; --soft:#5B6B8F; --line:#C9D8EE;
  --b2:#2F7BF5; --b2-soft:#DCE9FF; --b2-ink:#1450B8;
  --b5:#FF7A3D; --b5-soft:#FFE6D9; --b5-ink:#B8410C;
  --b10:#7A4CE0; --b10-soft:#EEE7FF; --b10-ink:#5A33B5;
  --good:#1FA563; --good-soft:#DDF6E8; --bad:#E5484D; --bad-soft:#FFE3E3;
  --star:#FFC21A; --gold:#F4B400; --pen:#D81B60; --teal:#16A3A3;
  --e1:#E0559B; --e2:#FF7A3D; --e3:#2F7BF5; --e4:#1FA563; --e5:#7A4CE0;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --hand:"Gochi Hand","Comic Sans MS","Segoe Print",cursive;
  color-scheme:light;
}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background-image:radial-gradient(circle at 14px 14px,rgba(122,76,224,.08) 2px,transparent 3px),radial-gradient(circle at 0 0,rgba(255,194,26,.12) 2px,transparent 3px);background-size:28px 28px,56px 56px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--b10);outline-offset:3px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 60px}
.c2{color:var(--b2-ink);font-weight:800}.c5{color:var(--b5-ink);font-weight:800}.c10{color:var(--b10-ink);font-weight:800}
.sub{color:var(--soft);font-size:16px;margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.center{justify-content:center}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px;color:var(--ink)}
.pill:hover{border-color:var(--b10)}

.big{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:60px;min-width:110px;padding:10px 24px;border-radius:18px;font-family:var(--display);font-weight:800;font-size:24px;border:3px solid transparent;box-shadow:0 5px 0 rgba(29,43,79,.2);transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(29,43,79,.2)}
.big.magic{background:linear-gradient(135deg,#7A4CE0,#E0559B);color:#fff}
.big.b2{background:var(--b2);color:#fff}.big.b5{background:var(--b5);color:#fff}.big.b10{background:var(--b10);color:#fff}
.big.plain{background:var(--paper);border-color:var(--line)}.big.go{background:var(--good);color:#fff}
.big.sel,.opt.sel{outline:5px solid var(--star);outline-offset:2px}
.big.small{min-height:48px;font-size:19px;padding:6px 16px;min-width:0}
.big[disabled]{opacity:.4;pointer-events:none}
.big.on{outline:5px solid var(--star);outline-offset:2px}
.opt{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 18px;font-size:20px;font-weight:800;min-height:58px;text-align:left;box-shadow:0 4px 0 var(--line)}
.opt:hover{border-color:var(--b10)}.opt.right{background:var(--good-soft);border-color:var(--good)}.opt.wrongpick{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{opacity:.75}
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.choices.col{flex-direction:column;align-items:stretch;max-width:680px;margin-inline:auto}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:var(--paper);border-radius:30px;padding:22px 26px;border:3px solid var(--line);position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,5.6vw,58px);font-weight:800}
.hero .sparkles{position:absolute;inset:0;pointer-events:none}
.hero .sparkles i{position:absolute;font-style:normal;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.tag{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--b10)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-top:18px}
.day{text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s;position:relative;min-width:0}
.day:hover{transform:translateY(-3px);border-color:var(--c,var(--b10))}
.day .when{font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.day h2{font-size:26px}
.day .goal{background:#F4F8FE;border-radius:14px;padding:8px 12px;font-weight:700;font-size:16px}
.epath{display:flex;gap:6px;flex-wrap:wrap}
.echip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;font-weight:800;color:#fff;background:var(--ec)}
.echip b{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center;font-size:12px}
.echip.done::after{content:"\2713";margin-left:2px}
.daystars{font-size:22px;letter-spacing:2px}
.star-on{color:var(--star)}.star-off{color:#D5DEEC}
.mini-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}

/* mascot + speech */
.guide{display:flex;gap:12px;align-items:flex-start;margin:6px 0 10px}
.mascot{flex:none;width:80px;height:80px;animation:bob 2.4s ease-in-out infinite}
.mascot.huge{width:124px;height:124px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.say{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-size:clamp(19px,2.4vw,23px);font-weight:800;min-width:0;flex:1;max-width:780px}
.say::before{content:"";position:absolute;left:-14px;top:22px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}
.say .spk{float:right;margin:-4px -6px 4px 8px;width:42px;height:42px;border-radius:50%;background:var(--b10-soft);font-size:20px}
.say .nm{display:block;font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}

/* lesson shell */
.lesson-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:12px 16px;margin-bottom:12px}
.schoollogo{width:120px;height:auto;display:block}.lesson-head .schoollogo{width:64px;margin-left:auto}
@media (max-width:600px){.hero .schoollogo{position:absolute;top:10px;right:10px;width:64px}}
.lesson-head h2{font-size:clamp(22px,3vw,30px)}
.today{font-weight:800;color:var(--soft);font-size:15px}
.today b{color:var(--ink)}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.step{display:flex;align-items:center;gap:8px;border-radius:16px;padding:6px 12px 6px 6px;background:var(--paper);border:3px solid var(--line);font-weight:800;font-size:15px;opacity:.75}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ec);font-family:var(--display);font-size:16px}
.step.now{border-color:var(--ec);opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--ec) 20%,transparent)}
.step.done{opacity:1}.step.done .n::after{content:"\2713"}.step.done .n span{display:none}
.card{background:var(--paper);border-radius:28px;border:3px solid var(--line);padding:20px;min-width:0;position:relative}
.estage-title{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.estage-title .badge{border-radius:999px;padding:4px 14px;color:#fff;font-family:var(--display);font-weight:800;font-size:20px;background:var(--ec)}
.task{font-size:20px;font-weight:800;margin:10px 0}
.next-row{display:flex;justify-content:flex-end;margin-top:14px}
.qbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.qchip{display:inline-block;border-radius:999px;padding:1px 12px;font-size:16px;font-weight:800;color:#fff}

/* book page */
.bookwrap{margin:8px 0}.bookwrap>.label{display:table;margin:0 6px 8px auto;background:var(--bk,#5B6B8F);color:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:13px}
.bookwrap.lb{--bk:var(--e2)} .bookwrap.wb{--bk:#5B6B8F}
.book{position:relative;border-radius:14px;overflow:hidden;overflow:clip;box-shadow:0 10px 30px rgba(29,43,79,.18),0 0 0 3px #fff,0 0 0 6px var(--bk,#5B6B8F);background:#fff;container-type:inline-size}
.book .sheet{position:absolute;left:0;width:100%}
.book img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.book.lb{--bk:var(--e2)} .book.wb{--bk:#5B6B8F}
.hw{position:absolute;display:flex;align-items:center;font-family:var(--hand);color:var(--pen);line-height:1;white-space:nowrap;pointer-events:none;clip-path:inset(0 100% 0 0);font-size:calc(var(--fs) * 1cqw);z-index:3}
.hw.c{justify-content:center}
.hw.shown{clip-path:inset(0 0 0 0)}
.hw.go{animation:write 1.1s steps(16,end) forwards}
.hw.ghost{color:#9AA8C4;clip-path:none}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.hot{position:absolute;border-radius:10px;z-index:4}
.hot.hint{animation:hint 1.6s ease-in-out infinite}
@keyframes hint{0%,100%{box-shadow:0 0 0 0 rgba(122,76,224,0)}50%{box-shadow:0 0 0 4px rgba(122,76,224,.55)}}
.hot.picked{box-shadow:0 0 0 5px var(--star)!important;animation:none;background:rgba(255,194,26,.18)}
.hot.badtap{animation:badtap .5s}
@keyframes badtap{0%,100%{background:transparent}40%{background:rgba(229,72,77,.35)}}
.hot.used{background:rgba(255,255,255,.72);pointer-events:none;animation:none}
.hot.area{border-radius:0}
.rowglow{position:absolute;border-radius:12px;box-shadow:0 0 0 5px var(--star),0 0 22px 6px rgba(255,194,26,.6);pointer-events:none;z-index:2;animation:glowp 1.4s ease-in-out infinite}
@keyframes glowp{50%{box-shadow:0 0 0 7px var(--star),0 0 30px 10px rgba(255,194,26,.75)}}
.marker{position:absolute;background:rgba(255,213,0,.45);mix-blend-mode:multiply;border-radius:6px;transform-origin:left;transform:scaleX(0);transition:transform .8s ease}
.marker.on{transform:scaleX(1)}
.book svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.book svg.lines .ink{fill:none;stroke:var(--pen);stroke-width:6;stroke-linecap:round;stroke-dasharray:1.02;stroke-dashoffset:1.02;animation:draw .8s ease forwards}
.book svg.lines .ink.now{animation:none;stroke-dashoffset:0}
.book svg.lines .ink.bad{stroke:var(--bad);stroke-dasharray:.04 .03;animation:none;stroke-dashoffset:0;opacity:.9}
@keyframes draw{to{stroke-dashoffset:0}}
.spark{position:absolute;z-index:6;pointer-events:none;font-size:22px;animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.flyer{position:fixed;z-index:70;pointer-events:none;font-family:var(--hand);color:var(--pen);font-size:34px;transition:left .8s cubic-bezier(.5,0,.3,1),top .8s cubic-bezier(.5,-.6,.4,1),transform .8s;text-shadow:0 0 12px #fff}

/* feedback */
.fb{margin-top:12px;border-radius:18px;padding:12px 16px;font-size:18px;font-weight:700;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;animation:fbin .3s}
@keyframes fbin{from{transform:translateY(8px);opacity:0}}
.fb.good{background:var(--good-soft);border:3px solid var(--good)}.fb.bad{background:var(--bad-soft);border:3px solid var(--bad)}.fb.info{background:var(--b10-soft);border:3px solid var(--b10)}
.fb .msg{flex:1;min-width:200px}.fb .face{font-size:30px;line-height:1}.fb .viz{width:100%}
.frame{background:#FFF8E1;border:3px solid #F2C94C;border-radius:18px;padding:12px 16px;font-size:clamp(19px,2.4vw,24px);font-weight:800;text-align:center;margin:10px 0}
.panel{background:#F4F8FE;border:2px solid var(--line);border-radius:20px;padding:12px;margin:10px 0;min-width:0;overflow:hidden}
.panel .ttl{text-align:center;font-weight:800;font-size:17px;margin-bottom:4px}
.eqline{font-family:var(--display);font-size:clamp(24px,3.4vw,32px);font-weight:800;text-align:center;line-height:1.2}
.bigstate{font-family:var(--display);font-size:clamp(30px,5vw,50px);font-weight:800;text-align:center;margin:8px 0}

/* hundred square */
.hs{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;max-width:600px;margin:10px auto}
.hc{position:relative;aspect-ratio:1;border-radius:10px;background:#fff;border:2px solid var(--line);font-family:var(--display);font-weight:800;font-size:clamp(12px,2.6vw,21px);line-height:1;padding:0;transition:background .25s,color .25s,transform .2s}
.hc.m2{background:var(--b2);border-color:var(--b2-ink);color:#fff}
.hc.m5{background:var(--b5);border-color:var(--b5-ink);color:#fff}
.hc.m10{background:var(--b10);border-color:var(--b10-ink);color:#fff}
.hc.pop{animation:pop .45s}
.hc.shake{animation:shake .4s}
.hc.l2{background:var(--b2-soft)}
.hc.l5{box-shadow:inset 0 0 0 4px var(--b5)}
.hc.l10::after{content:"★";position:absolute;right:1px;top:-3px;font-size:clamp(10px,1.8vw,15px);color:var(--b10)}
.hc .od{color:inherit}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wands{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:15px;margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:20px;height:20px;border-radius:6px}

/* dots and groups */
.sdots{display:inline-grid;grid-auto-flow:column;grid-template-rows:repeat(2,var(--s,18px));gap:3px;vertical-align:middle}
.sdots b{width:var(--s,18px);height:var(--s,18px);border-radius:50%;border:1.5px solid rgba(29,43,79,.45);display:block}
.sdots b.lone{box-shadow:0 0 0 3px var(--star);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,194,26,.9)}50%{box-shadow:0 0 0 9px rgba(255,194,26,0)}}
.gtray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:70px;margin:10px 0;align-items:center}
.grp1{display:flex;gap:4px;padding:6px;border-radius:14px;border:3px solid var(--gc);background:color-mix(in srgb,var(--gc) 10%,#fff);animation:capin .45s backwards;position:relative;flex-wrap:wrap;max-width:146px;justify-content:center}
.grp1 i{width:22px;height:22px;border-radius:50%;background:var(--gc);display:block;border:2px solid rgba(29,43,79,.35)}
.grp1 em{position:absolute;top:-12px;right:-8px;background:var(--gc);color:#fff;font-style:normal;font-family:var(--display);font-weight:800;font-size:14px;border-radius:999px;padding:0 7px}
@keyframes capin{from{transform:translateY(-30px) scale(.5);opacity:0}}
.verdict{text-align:center;font-family:var(--display);font-size:clamp(20px,3vw,28px);font-weight:800}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.flip{perspective:900px;min-height:230px}
.flip .in{position:relative;width:100%;height:100%;min-height:230px;transition:transform .7s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;background:var(--paper);text-align:center;gap:8px}
.flip .f{color:#fff;font-family:var(--display);font-size:30px;font-weight:800;cursor:pointer;border:0}
.flip .f small{font-family:var(--body);font-size:15px;opacity:.9}
.flip .b{transform:rotateY(180deg);font-weight:800;font-size:19px}
.strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-weight:800;font-size:22px}
.strip span{background:#F4F8FE;border-radius:10px;padding:0 8px}
.strip u{text-decoration:none;color:#fff;background:var(--uc);border-radius:6px;padding:0 3px}

/* arrays */
.arr{position:relative;margin:6px auto;transition:height .4s}
.arr .it{position:absolute;transition:left .7s cubic-bezier(.4,1.3,.5,1),top .7s cubic-bezier(.4,1.3,.5,1),transform .4s,opacity .4s}
.arr .it svg{display:block;width:100%;height:100%}
.arr .it.lit{transform:scale(1.18)}
.arr .grp{position:absolute;border:4px solid var(--gc,var(--b10));border-radius:14px;background:color-mix(in srgb,var(--gc,var(--b10)) 9%,transparent);transition:left .7s cubic-bezier(.4,1.3,.5,1),top .7s cubic-bezier(.4,1.3,.5,1),width .7s,height .7s,opacity .3s;animation:grpin .35s backwards;pointer-events:none}
.arr .grp b{position:absolute;right:-12px;top:-14px;background:var(--gc,var(--b10));color:#fff;border-radius:999px;font-family:var(--display);font-size:16px;padding:0 8px;line-height:24px;white-space:nowrap}
.arr .grp.cols b{right:auto;left:50%;top:auto;bottom:-14px;transform:translateX(-50%)}
@keyframes grpin{from{transform:scale(1.2);opacity:0}}
.arrcap{text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,28px);min-height:1.4em}
.factbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.factbtns .big{font-size:26px;min-width:120px}
.factbtns .big.tried{background:var(--good-soft);border-color:var(--good)}

/* fact family triangle */
.tri{display:block;margin:0 auto;max-width:300px;width:100%;height:auto}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:520px;margin:10px auto}
.facts div{background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,26px);animation:capin .4s backwards}
.facts div.m{border-color:var(--b2)}.facts div.d{border-color:var(--b5)}
.seesaw{display:flex;flex-direction:column;align-items:center;margin:10px 0}
.seesaw .beam{display:flex;align-items:center;gap:10px;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:8px 14px;font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,34px);transition:transform .6s}
.seesaw .pivot{width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:34px solid var(--ink)}
.seesaw .side{padding:2px 12px;border-radius:12px;transition:transform .7s}
.seesaw .side.a{background:var(--b2-soft)}.seesaw .side.b{background:var(--b5-soft)}

/* tiles */
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.tile{min-width:72px;height:64px;border-radius:16px;font-family:var(--display);font-size:32px;font-weight:800;color:#fff;background:var(--b10);box-shadow:0 5px 0 var(--b10-ink);padding:0 12px}
.tile.used{opacity:.25;pointer-events:none}
.tile.alt{background:var(--teal);box-shadow:0 5px 0 #0E7A7A}
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:460px;margin:10px auto}
.pad button{height:58px;border-radius:14px;background:var(--paper);border:3px solid var(--line);font-family:var(--display);font-size:28px;font-weight:800}
.pad button.used{background:var(--good-soft);border-color:var(--good);pointer-events:none}

/* base ten */
.b10stage{display:flex;gap:18px;justify-content:center;align-items:flex-end;flex-wrap:wrap;min-height:120px;margin:10px 0}
.b10grp{display:flex;flex-direction:column;align-items:center;gap:6px}
.b10blocks{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;justify-content:center;max-width:330px}
.blk{--u:8px;width:var(--u);height:var(--u);background:var(--b2);border:1px solid var(--b2-ink);transition:width .9s cubic-bezier(.4,1.4,.5,1),height .9s cubic-bezier(.4,1.4,.5,1),background .6s;
  background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:var(--u) var(--u)}
.blk.rod{height:calc(var(--u)*10);background-color:var(--b5);border-color:var(--b5-ink)}
.blk.flat{width:calc(var(--u)*10);height:calc(var(--u)*10);background-color:var(--b10);border-color:var(--b10-ink)}
.b10lbl{font-weight:800;font-size:16px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 12px;white-space:nowrap}

/* place value slide */
.pv{max-width:520px;margin:10px auto;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.pv .hd,.pv .rw{display:grid;grid-template-columns:repeat(3,1fr)}
.pv .hd div{background:#8DC2CC;text-align:center;font-weight:800;font-size:20px;padding:4px;border-right:2px solid var(--ink)}
.pv .rw>div{position:relative;height:66px;border-right:2px solid var(--ink);border-top:2px solid var(--ink)}
.pv .hd div:last-child,.pv .rw>div:last-child{border-right:0}
.pv .dg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hand);font-size:46px;color:var(--pen);transition:transform 1s cubic-bezier(.5,0,.3,1.3)}
.pv .dg.slide{transform:translateX(-100%)}
.pv .dg.zero{color:var(--b10);animation:zeroin .8s backwards}
@keyframes zeroin{from{transform:scale(3) rotate(-30deg);opacity:0}}
.pv .dg.trail::after{content:"";position:absolute;left:60%;top:50%;width:80%;height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,194,26,.9),transparent);opacity:0;animation:trail 1s}
@keyframes trail{30%{opacity:1}100%{opacity:0}}

/* pencil boxes */
.pboxes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;margin:10px 0;min-height:60px}
.pbox{width:34px;height:46px;border-radius:5px;background:linear-gradient(#2A4D8F 0 18%,#3A7BD5 18%);position:relative;animation:capin .35s backwards;flex:none}
.pbox::before{content:"";position:absolute;left:3px;right:3px;top:-8px;height:10px;background:repeating-linear-gradient(90deg,#E5484D 0 3px,#FFC21A 3px 6px,#1FA563 6px 9px,#7A4CE0 9px 12px)}
.pbox::after{content:"10";position:absolute;left:0;right:0;bottom:3px;text-align:center;color:#fff;font-weight:800;font-size:13px}
.crate{display:flex;flex-wrap:wrap;gap:3px;width:118px;padding:16px 5px 5px;border:4px solid var(--b10);border-radius:12px;background:var(--b10-soft);position:relative;animation:capin .5s backwards}
.crate .pbox{width:20px;height:28px;animation:none}.crate .pbox::after{font-size:9px}.crate .pbox::before{top:-5px;height:6px}
.crate b{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--b10);color:#fff;border-radius:999px;padding:0 10px;font-family:var(--display);font-size:16px}
.count{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,40px);text-align:center}

/* number line */
.nl{position:relative;height:150px;margin:6px 4px 0}
.nl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.nl .tk{position:absolute;top:96px;transform:translateX(-50%);min-width:30px;height:40px;border-radius:10px;font-family:var(--display);font-weight:800;font-size:clamp(13px,2.2vw,19px);padding:0 2px;background:#fff;border:2px solid var(--line)}
.nl .tk.on{background:var(--b5);border-color:var(--b5-ink);color:#fff}
.nl .tk.start{background:var(--b2);border-color:var(--b2-ink);color:#fff}
.nl .tk.shake{animation:shake .4s}
.nl .frog{position:absolute;top:44px;font-size:38px;transform:translate(-50%,0);line-height:1;transition:none;z-index:3}
.nl .jl{position:absolute;top:2px;transform:translateX(-50%);font-weight:800;color:var(--b5-ink);font-size:15px}

/* x10 machine */
.mach{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0;flex-wrap:nowrap}
.mach .chipn{min-width:74px;height:62px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:30px;background:#fff;border:3px solid var(--line);transition:transform .7s,opacity .5s;padding:0 10px}
.mach .box{width:130px;height:110px;border-radius:22px;background:linear-gradient(160deg,#9AA8C4,#5B6B8F);border:4px solid var(--ink);display:grid;place-items:center;position:relative;flex:none}
.mach .box span{background:#fff;border-radius:10px;padding:4px 10px;font-family:var(--display);font-weight:800;font-size:28px}
.mach .box::before,.mach .box::after{content:"";position:absolute;top:-16px;width:18px;height:18px;border-radius:50%;background:var(--star);border:3px solid var(--ink)}
.mach .box::before{left:24px}.mach .box::after{right:24px}
.mach .box.work{animation:shake .25s 3}
.mach .out{color:var(--b10-ink);border-color:var(--b10)}
.mach .chipn.in-go{transform:translateX(60px) scale(.3);opacity:0}

/* riddle */
.rid{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.rid span{width:52px;height:56px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;background:#fff;border:3px solid var(--line);transition:opacity .5s,transform .5s}
.rid span.out{opacity:.15;transform:scale(.7) rotate(-12deg)}
.rid span.win{background:var(--star);border-color:var(--gold);transform:scale(1.3);animation:pop .6s}
.clues{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* certificate */
.cert{text-align:center;padding:10px 0}
.lwicd{max-width:720px;margin:14px auto;border-radius:12px;overflow:hidden;text-align:left}
.lwicd .t{background:#3F8F9C;color:#fff;font-weight:800;padding:10px 16px;font-size:20px}
.lwicd .bdy{background:#A0C9CF;padding:14px 16px;display:flex;gap:14px;align-items:center;font-weight:700;font-size:19px}
.lwicd .box{flex:none;width:40px;height:40px;background:#fff;border-radius:6px;display:grid;place-items:center;font-family:var(--hand);font-size:40px;color:var(--pen)}
.lwicd .box span{clip-path:inset(0 100% 0 0);animation:write .8s .6s steps(8,end) forwards}
.bigstars{font-size:60px;letter-spacing:8px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 1.9s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* copy to my book */
.booktabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.booktabs button{font-family:var(--display);font-weight:800;font-size:22px;padding:10px 22px;border-radius:16px;border:3px solid var(--line);background:var(--paper)}
.booktabs button.on.lb{background:var(--b5-soft);border-color:var(--b5)}.booktabs button.on.wb{background:#E7EBF1;border-color:#5B6B8F}
.pagehead{font-family:var(--display);font-weight:800;font-size:24px;margin-top:16px}
.modal{position:fixed;inset:0;background:rgba(29,43,79,.6);z-index:50;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.modal .inner{max-width:1100px;margin:0 auto}
.modal .closeb{position:sticky;top:0;z-index:10;display:flex;justify-content:flex-end;margin-bottom:8px}

@media (max-width:600px){
  body{font-size:17px}
  .hero{grid-template-columns:1fr;padding:18px;text-align:center}.hero .mascot{margin:0 auto}
  .card{padding:14px;border-radius:22px}
  .big{min-width:90px;font-size:21px;padding:8px 16px}
  .mascot{width:58px;height:58px}
  .step .t{display:none}
  .hs{gap:2px}.hc{border-radius:6px;border-width:1px}
  .mach .box{width:100px;height:90px}.mach .box span{font-size:22px}.mach .chipn{min-width:60px;font-size:24px}
  .rid span{width:44px;height:50px;font-size:20px}
  .tile{min-width:62px;height:58px;font-size:28px}
  .pv .dg{font-size:38px}.pv .rw>div{height:56px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.hw.go{clip-path:inset(0 0 0 0)}}
@media print{.bar,.booktabs,.noprint{display:none!important}body{background:#fff}.book{break-inside:avoid;box-shadow:none}}
/* Unit 5 extras: equal groups, pictures, counting stick, coloured cells */
.cfill{position:absolute;border-radius:8px;mix-blend-mode:multiply;z-index:2;animation:cfin .45s}
.cfill.now{animation:none}
@keyframes cfin{from{transform:scale(.2);opacity:0}}
.tcol{font-weight:800}
.dbl{display:inline-block;background:var(--good-soft);border:2px solid var(--good);border-radius:10px;padding:0 8px;color:#14804B}
.hlv{display:inline-block;background:var(--b10-soft);border:2px solid var(--b10);border-radius:10px;padding:0 8px;color:var(--b10-ink)}
.gv{--d:24px;display:flex;flex-direction:column;gap:calc(var(--d)*.35);align-items:center;margin:8px auto;max-width:760px}
.gvrow{display:flex;align-items:center;gap:10px;border-radius:999px;padding:3px 10px;background:#fff;border:2px solid var(--line);transition:box-shadow .2s,transform .2s;max-width:100%}
.gvrow.lit{box-shadow:0 0 0 4px var(--star);transform:scale(1.03)}
.gvrow.pop{animation:capin .45s}
.gvdots{display:flex;gap:calc(var(--d)*.3)}
.gvdots i{display:block;width:var(--d);height:var(--d);border-radius:50%;border:2px solid rgba(29,43,79,.35);transition:opacity .5s,transform .5s}
.gvdots i.new{animation:dotin .5s backwards}
.gvdots i.gone{opacity:0;transform:scale(.2)}
@keyframes dotin{from{transform:scale(0) translateY(-14px);opacity:0}60%{transform:scale(1.3)}}
.gvtot{min-width:38px;font-family:var(--display);font-size:calc(var(--d)*.85 + 6px);color:var(--soft);opacity:0;transition:opacity .2s}
.gvtot.on{opacity:1;color:var(--ink)}
.pics{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.pic{position:relative;width:86px;display:flex;justify-content:center;padding:4px;border-radius:14px;transition:background .2s}
.pics.spider .pic{width:100px}.pics.domino .pic{width:62px}
.pic.now{background:#FFF8E1}
.pic.pop{animation:capin .45s}
.pic svg{width:100%;height:auto;display:block}
.pic .parts > *{stroke:#1D2B4F;transition:stroke .2s}
.pics.square .pic .parts > *{stroke:#1D2B4F}
.pic .parts > .lit{stroke:var(--star)}
.pics.spider .pic .parts > .lit{stroke:#7A4CE0}
.pic .pt,.pic .pb{transition:fill .2s}
.pic .pt.lit{fill:#F4B400}.pic .pb.lit{fill:#16A3A3}
.pic .word{display:grid;place-items:center;width:78px;height:58px;border:3px solid var(--ink);border-radius:8px;background:#fff;font-weight:800;font-size:20px}
.pbadge{position:absolute;top:-10px;right:-6px;background:var(--ink);color:#fff;font-family:var(--display);font-size:18px;border-radius:999px;padding:0 9px;opacity:0;transform:scale(.5);transition:opacity .2s,transform .2s}
.pbadge.on{opacity:1;transform:scale(1)}
.cstick{position:relative;margin:16px 6% 10px 6%}
.stickbar{display:flex;height:26px;border-radius:6px;overflow:hidden;border:3px solid var(--ink)}
.stickbar span{flex:1}
.cstick .zero{position:absolute;left:0;top:-26px;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:18px}
.stickrows{margin-top:8px}
.srow{position:relative;height:54px}
.slab{position:absolute;left:-6%;top:12px;transform:translateX(-40%);color:#fff;border-radius:999px;padding:0 8px;font-weight:800;font-size:13px}
.scell{position:absolute;top:6px;transform:translateX(-50%);min-width:38px;height:42px;border-radius:12px;background:#fff;border:3px solid var(--line);font-family:var(--display);font-weight:800;font-size:clamp(14px,2.4vw,20px);padding:0 3px;color:var(--soft)}
.scell.on{color:#fff}
.scell.pop{animation:pop .45s}
.scell.next{box-shadow:0 0 0 4px var(--star);animation:hint 1.4s infinite}
.bricks{display:flex;flex-direction:column;align-items:center;gap:0;margin:10px 0}
.bricks .br{display:flex}
.bricks .br span{width:74px;height:52px;border:3px solid var(--ink);margin:-1.5px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;background:#FBE3D6}
.bricks .br span.q{background:#fff;color:var(--soft)}
.bricks .br span.hot{background:#FFF1B8;box-shadow:inset 0 0 0 4px var(--star)}
.mini-venn{display:block;margin:6px auto;max-width:420px;width:100%;height:auto}
.addrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.6vw,32px);margin:8px 0}
.addrow .chip{background:#fff;border:3px solid var(--line);border-radius:14px;padding:2px 14px}
@media (max-width:600px){.pic{width:64px}.pics.spider .pic{width:76px}.pics.domino .pic{width:46px}.bricks .br span{width:58px;height:44px;font-size:20px}.scell{min-width:30px;height:36px}}
.pend{opacity:0;animation:pendin .6s forwards}
.pend.now{opacity:1;animation:none}
@keyframes pendin{to{opacity:1}}
button.qchip{border:0;cursor:pointer;font-family:inherit;padding:4px 14px;margin:2px}
button.qchip.now{outline:3px solid var(--line);outline-offset:2px}
.qhint{font-size:14px;font-weight:700;color:var(--soft);margin-left:6px}
.fillrow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0}
.fillbox{width:78px;height:64px;border:3px solid var(--line);border-radius:14px;text-align:center;font-family:var(--display);font-size:30px;font-weight:800;color:var(--ink);background:#fff}
.fillbox:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.fillbox.now{border-color:#F4B400;background:#FFF6D6;box-shadow:0 0 0 4px rgba(244,180,0,.35)}
.fillbox.ok{border-color:var(--good);background:var(--good-soft)}
.fillbox.bad{border-color:#E5484D;background:#FFE7E7;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Q1: the fact family for 9 rows of 6 */
function c1Fam(st,api){
  st.appendChild(guide('Question 1. Write the fact family for this array. First, look at the smiles.'));
  var bk=BookView('lb87');var arr=ArrayView(9,6,{item:'smile',max:30});
  var two=h('div',{class:'row',style:'align-items:flex-start;gap:14px'});var L=h('div',{style:'flex:1 1 300px;min-width:260px'}),R=h('div',{style:'flex:1 1 300px;min-width:260px'});
  L.appendChild(bk.el);R.appendChild(panelOf(arr.el,arr.cap));two.appendChild(L);two.appendChild(R);st.appendChild(two);
  var area=h('div');R.appendChild(area);
  var steps=[
    {q:'How many smiles are in each row?',opts:[{label:'6',ok:true},{label:'9',why:'Count across one row: 1, 2, 3, 4, 5, 6.'},{label:'54',why:'That is all of them. Count just one row.'}]},
    {q:'How many rows are there?',opts:[{label:'9',ok:true},{label:'6',why:'Count down the side: 1, 2, 3 ... 9.'},{label:'10',why:'Count down the side again: there are 9 rows.'}]},
    {q:'9 rows of 6. How many smiles altogether?',opts:[{label:'54',ok:true},{label:'15',why:'9 + 6 = 15 is adding. We need 9 groups of 6.'},{label:'45',why:'45 is 9 × 5. Each row has 6. Try 9 × 5 + 9 = 54.'}]}
  ];
  (function ask(i){area.innerHTML='';if(i>=steps.length){build();return}
    area.appendChild(h('p',{class:'task',style:'text-align:center'},[steps[i].q]));
    choiceQ(area,api,shuffle(steps[i].opts),function(){if(i===2)arr.groups(6,false,'9 rows of '+tc(6)+' = <b>54</b>',function(){later(function(){ask(3)},500)});else later(function(){ask(i+1)},500)},{cls:function(){return 'big plain'}})})(0);
  function build(){
    area.innerHTML='';var made={},k=0,fill=[],glow=null,busy=false;
    var status=h('p',{class:'task',style:'text-align:center'}),slots=h('div',{class:'bigstate'}),tray=h('div',{class:'tiles'});
    area.appendChild(status);area.appendChild(slots);area.appendChild(tray);
    var clr=h('button',{class:'big plain small'},['Clear']);area.appendChild(h('div',{class:'row center'},[clr]));clr.onclick=function(){if(!busy){fill=[];draw()}};
    function op(){return k<2?'×':'÷'}
    function sl(j){return '<span style="display:inline-block;min-width:60px;border-bottom:4px solid var(--line);margin:0 4px">'+(fill[j]!=null?fill[j]:'&nbsp;')+'</span>'}
    function draw(){slots.innerHTML=sl(0)+' '+op()+' '+sl(1)+' = '+sl(2);
      each(tray.children,function(t){t.classList.toggle('used',fill.indexOf(+t.textContent)>=0)})}
    function startFact(){
      if(glow)glow.remove();
      if(k>=4){status.innerHTML='4 facts! ✨';tray.remove();slots.remove();clr.parentNode.remove();extra();return}
      var a=ANS['q1_'+k];glow=bk.glow(a[1]-6,a[2]-4,a[3]+12,a[4]+8);
      status.innerHTML='Fact '+(k+1)+' of 4: tap the numbers to make a <b>'+(op()==='×'?'times ×':'divide ÷')+'</b> fact.'+(k===2?'<br><small>Divide: start with the biggest number, 54.</small>':'');
      fill=[];draw();
    }
    [6,9,54,15].forEach(function(n){var t=h('button',{class:'tile'+(n===15?' alt':'')},[String(n)]);tray.appendChild(t);t.onclick=function(){
      if(busy||fill.length>=3||fill.indexOf(n)>=0)return;
      if(n===15){api.miss();sBad();feedback(area,'bad','15 is 6 + 9. That is adding! The array has <b>54</b> smiles.');return}
      fill.push(n);sPop();draw();if(fill.length===3)later(check,250)}});
    function check(){
      var a=fill[0],b=fill[1],c=fill[2],o=op(),ok=o==='×'?a*b===c:a/b===c,txt=a+' '+o+' '+b+' = '+c;
      if(!ok){api.miss();sBad();feedback(area,'bad',o==='×'?'Look at the array: 6 × 9 makes <b>54</b>. The big number goes after =.':'When we divide, we start with the biggest number, <b>54</b>: 54 ÷ 6 = 9.');later(function(){fill=[];draw()},900);return}
      if(made[txt]){api.miss();sBad();feedback(area,'bad','You already made that one! Swap the two small numbers around.');later(function(){fill=[];draw()},900);return}
      made[txt]=1;busy=true;var fb=area.querySelector(':scope > .fb');if(fb)fb.remove();
      bk.write('q1_'+k,0,txt);
      factOnArray(arr,o==='×'?{op:'×',a:a,b:b,txt:txt}:{op:'÷',a:a,b:b,txt:txt},function(){busy=false;k++;startFact()});
    }
    startFact();
  }
  function extra(){
    area.appendChild(h('div',{class:'frame',html:'Super star trick: the = sign is a balance. You can write each fact the other way round too!'}));
    var b=h('button',{class:'big magic'},['⭐ Starry, write the other 4 facts!']);area.appendChild(h('div',{class:'row center'},[b]));
    b.onclick=function(){b.parentNode.remove();[4,5,6,7].forEach(function(i,j){bk.write('q1_'+i,j*700)});later(function(){api.done('<b>8 facts</b> from one array: 6, 9 and 54!')},3200)};
  }
}
/* Q2: multiples of 2, 5 and 10 */
function c1Ring(st,api){

  st.appendChild(h('div',{class:'frame',html:tc(2,'2 ×')+' ends in 0, 2, 4, 6, 8 &nbsp;·&nbsp; '+tc(5,'5 ×')+' ends in 0 or 5 &nbsp;·&nbsp; '+tc(10,'10 ×')+' ends in 0<br>Only numbers ending in <b>0</b> are in all three!'}));

}
