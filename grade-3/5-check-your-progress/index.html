<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>window.FBH_STANDALONE=true;</script>
<title>Check Your Progress Champions</title><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="apple-touch-icon" href="../../assets/insightia-logo.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&family=Gochi+Hand&display=swap">
<style>
/* Layout: lesson map -> one lesson at a time, five steps per lesson.
   The real book page is always on screen; answers are hand-written into its blanks.
   Colour code everywhere: FACTOR = purple, MULTIPLE = orange, PRODUCT = blue. One bright look, chosen on purpose for projectors. */
:root{
  --bg:#EAF4FF; --paper:#FFFFFF; --ink:#1D2B4F; --soft:#5B6B8F; --line:#C9D8EE;
  --odd:#FF7A3D; --odd-soft:#FFE6D9; --odd-ink:#B8410C;
  --even:#2F7BF5; --even-soft:#DCE9FF; --even-ink:#1450B8;
  --good:#1FA563; --good-soft:#DDF6E8; --bad:#E5484D; --bad-soft:#FFE3E3;
  --star:#FFC21A; --purple:#7A4CE0; --purple-soft:#EEE7FF; --pen:#D81B60;
  --e1:#E0559B; --e2:#FF7A3D; --e3:#2F7BF5; --e4:#1FA563; --e5:#7A4CE0;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --hand:"Gochi Hand","Comic Sans MS","Segoe Print",cursive;
  color-scheme:light;
}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 12px 12px,rgba(47,123,245,.07) 3px,transparent 4px);background-size:28px 28px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--purple);outline-offset:3px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 60px}
.o{color:var(--odd-ink);font-weight:800}.e{color:var(--even-ink);font-weight:800}
.sub{color:var(--soft);font-size:16px;margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:14px}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill:hover{border-color:var(--purple)} .pill.on{background:var(--purple-soft);border-color:var(--purple)}

/* buttons */
.big{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:60px;min-width:110px;padding:10px 24px;border-radius:18px;font-family:var(--display);font-weight:800;font-size:24px;border:3px solid transparent;box-shadow:0 5px 0 rgba(29,43,79,.2);transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(29,43,79,.2)}
.big.odd{background:var(--odd);color:#fff}.big.even{background:var(--even);color:#fff}.big.both{background:var(--purple);color:#fff}
.big.plain{background:var(--paper);border-color:var(--line)}.big.go{background:var(--good);color:#fff}.big.no{background:var(--bad);color:#fff}
.big.sel{outline:5px solid var(--star);outline-offset:2px}
.big.small{min-height:48px;font-size:19px;padding:6px 16px;min-width:0}
.big[disabled]{opacity:.4;pointer-events:none}
.opt{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 18px;font-size:20px;font-weight:800;min-height:58px;text-align:left;box-shadow:0 4px 0 var(--line)}
.opt:hover{border-color:var(--purple)}.opt.right{background:var(--good-soft);border-color:var(--good)}.opt.wrongpick{background:var(--bad-soft);border-color:var(--bad)}
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.choices.col{flex-direction:column;align-items:stretch;max-width:640px;margin-inline:auto}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:var(--paper);border-radius:30px;padding:22px 26px;border:3px solid var(--line);position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,5.6vw,58px);font-weight:800}
.tag{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:18px}
.day{text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s;position:relative}
.day:hover{transform:translateY(-3px);border-color:var(--c,var(--purple))}
.day .when{font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.day h2{font-size:28px}
.day .goal{background:#F4F8FE;border-radius:14px;padding:8px 12px;font-weight:700;font-size:16px}
.epath{display:flex;gap:6px;flex-wrap:wrap}
.echip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;font-weight:800;color:#fff;background:var(--ec)}
.echip b{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center;font-size:12px}
.echip.done::after{content:"\2713";margin-left:2px}
.daystars{font-size:22px;letter-spacing:2px}
.star-on{color:var(--star)}.star-off{color:#D5DEEC}
.mini-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}

/* mascot + speech */
.guide{display:flex;gap:12px;align-items:flex-start;margin:6px 0 10px}
.mascot{flex:none;width:76px;height:76px;animation:bob 2.4s ease-in-out infinite}
.mascot.huge{width:120px;height:120px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.say{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-size:clamp(19px,2.4vw,23px);font-weight:800;min-width:0;flex:1;max-width:760px}
.say::before{content:"";position:absolute;left:-14px;top:22px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}
.say .spk{float:right;margin:-4px -6px 4px 8px;width:42px;height:42px;border-radius:50%;background:var(--purple-soft);font-size:20px}
.say .nm{display:block;font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}

/* lesson shell */
.lesson-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:12px 16px;margin-bottom:12px}
.schoollogo{width:120px;height:auto;display:block}.lesson-head .schoollogo{width:64px;margin-left:auto}
@media (max-width:600px){.hero .schoollogo{position:absolute;top:10px;right:10px;width:64px}}
.lesson-head h2{font-size:clamp(22px,3vw,30px)}
.today{font-weight:800;color:var(--soft);font-size:15px}
.today b{color:var(--ink)}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.step{display:flex;align-items:center;gap:8px;border-radius:16px;padding:6px 12px 6px 6px;background:var(--paper);border:3px solid var(--line);font-weight:800;font-size:15px;opacity:.75}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ec);font-family:var(--display);font-size:16px}
.step .mins{font-size:12px;color:var(--soft);display:block;font-weight:700}
.step.now{border-color:var(--ec);opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--ec) 20%,transparent)}
.step.done{opacity:1}.step.done .n::after{content:"\2713"}.step.done .n span{display:none}
.card{background:var(--paper);border-radius:28px;border:3px solid var(--line);padding:20px;min-width:0;position:relative}
.estage-title{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.estage-title .badge{border-radius:999px;padding:4px 14px;color:#fff;font-family:var(--display);font-weight:800;font-size:20px;background:var(--ec)}
.task{font-size:20px;font-weight:800;margin:8px 0}
.next-row{display:flex;justify-content:flex-end;margin-top:14px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.split > *{min-width:0}

/* book page */
.bookwrap{margin:8px 0}.bookwrap>.label{display:table;margin:0 6px 8px auto;background:var(--bk,#5B6B8F);color:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:13px}
.bookwrap.lb{--bk:var(--e2)} .bookwrap.wb{--bk:#5B6B8F}
.book{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(29,43,79,.18),0 0 0 3px #fff,0 0 0 6px var(--bk,#5B6B8F);background:#fff;container-type:inline-size}
.book .sheet{position:absolute;left:0;width:100%}
.book img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.book.lb{--bk:var(--e2)} .book.wb{--bk:#5B6B8F}
.hw{position:absolute;display:flex;align-items:center;font-family:var(--hand);color:var(--pen);line-height:1;white-space:nowrap;pointer-events:none;clip-path:inset(0 100% 0 0);font-size:calc(var(--fs) * 1cqw)}
.hw.c{justify-content:center}
.hw.shown{clip-path:inset(0 0 0 0)}
.hw.go{animation:write 1.1s steps(16,end) forwards}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.shade{position:absolute;background:rgba(255,122,61,.62);mix-blend-mode:multiply;border-radius:2px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.shade.on{transform:scale(1)}
.hot{position:absolute;border-radius:10px;z-index:4}
.hot.hint{animation:hint 1.6s ease-in-out infinite}
@keyframes hint{0%,100%{box-shadow:0 0 0 0 rgba(122,76,224,0)}50%{box-shadow:0 0 0 4px rgba(122,76,224,.55)}}
.hot.picked{box-shadow:0 0 0 5px var(--star)!important;animation:none}
.hot.badtap{animation:badtap .5s}
@keyframes badtap{0%,100%{background:transparent}40%{background:rgba(229,72,77,.35)}}
.hot.used{background:rgba(255,255,255,.75);pointer-events:none;animation:none}
.marker{position:absolute;background:rgba(255,213,0,.45);mix-blend-mode:multiply;border-radius:6px;transform-origin:left;transform:scaleX(0);transition:transform .8s ease}
.marker.on{transform:scaleX(1)}
.book svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.book svg.lines line{stroke:var(--pen);stroke-width:7;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw .8s ease forwards}
.book svg.lines line.bad{stroke:var(--bad);stroke-dasharray:14 12;animation:none;opacity:.9}
@keyframes draw{to{stroke-dashoffset:0}}
.spark{position:absolute;z-index:6;pointer-events:none;font-size:22px;animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.pagebtn{display:block;width:100%;padding:0;text-align:left}

/* dots */
.dotstage{position:relative;margin:6px auto;transition:height .3s;touch-action:pan-y}
.dotstage.drag{touch-action:none;cursor:grab}
.dot{position:absolute;border-radius:50%;border:2px solid rgba(29,43,79,.55);transition:left .7s cubic-bezier(.4,1.4,.5,1),top .7s,opacity .5s,transform .5s}
.dot.B{cursor:grab}
.dotstage.dragging .dot.B{transition:none}
.dot.gone{opacity:0;transform:translateY(-40px) scale(.4)!important}
.dot.marked::after{content:"";position:absolute;inset:-6px;border:3px dashed var(--bad);border-radius:50%}
.dot.lonely{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,194,26,.9)}50%{box-shadow:0 0 0 10px rgba(255,194,26,0)}}
.dlabel{position:absolute;font-family:var(--display);font-weight:800;text-align:center;transition:opacity .4s,left .7s}
.glowbox{position:absolute;border:4px solid var(--even);border-radius:16px;box-shadow:0 0 0 6px rgba(47,123,245,.15),0 0 24px rgba(47,123,245,.45);opacity:0;transform:scale(1.15);transition:opacity .4s,transform .4s;pointer-events:none}
.glowbox.on{opacity:1;transform:scale(1)}
.draghint{position:absolute;font-weight:800;font-size:14px;color:var(--purple);white-space:nowrap;animation:nudge 1.2s ease-in-out infinite;pointer-events:none}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px)}}
.sdots{display:inline-grid;grid-auto-flow:column;grid-template-rows:repeat(2,var(--s,18px));gap:3px;vertical-align:middle}
.sdots b{width:var(--s,18px);height:var(--s,18px);border-radius:50%;border:1.5px solid rgba(29,43,79,.45);display:block}
.sdots b.lone{box-shadow:0 0 0 3px var(--star);animation:pulse 1s infinite}
.numdots{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.pairsblock{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:62px;min-height:40px;padding:4px 10px;border-radius:12px;border:2px dashed var(--even);color:var(--even-ink);font-family:var(--display);font-weight:800;font-size:20px;line-height:1;background:radial-gradient(circle,rgba(47,123,245,.28) 3px,transparent 4px) 0 0/12px 12px,#EEF4FF}
.pairsblock small{font-family:var(--body);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.plus{font-family:var(--display);font-weight:800;font-size:26px}
.test{background:#F4F8FE;border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin:8px 0;min-width:0}
.tests{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.tests .test{margin:0}
.rl{text-align:center;font-weight:800;font-size:17px;margin-top:2px}
.eqline{font-family:var(--display);font-size:26px;font-weight:800;text-align:center}
.chip{display:inline-block;border-radius:999px;padding:1px 12px;font-size:16px;font-weight:800;color:#fff;vertical-align:middle}
.chip.odd{background:var(--odd)}.chip.even{background:var(--even)}
.claim{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:800;margin:6px 0}

/* pairing towers (engage) */
.numpad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:520px;margin:10px auto}
.numpad button{height:62px;border-radius:16px;background:var(--paper);border:3px solid var(--line);font-family:var(--display);font-size:30px;font-weight:800}
.numpad button.odd{background:var(--odd);border-color:var(--odd-ink);color:#fff}
.numpad button.even{background:var(--even);border-color:var(--even-ink);color:#fff}
.pairs{display:flex;gap:10px;justify-content:center;align-items:flex-start;min-height:120px;flex-wrap:wrap;margin:10px 0}
.cap{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:999px;border:3px solid transparent;animation:capin .4s backwards}
.cap.full{border-color:rgba(47,123,245,.5);background:rgba(47,123,245,.08)}
.cap.alone{border-color:transparent}
.cap i{width:40px;height:40px;border-radius:50%;display:block;border:2px solid rgba(29,43,79,.5)}
.cap.alone i{animation:pulse 1s infinite}
@keyframes capin{from{transform:translateY(-30px) scale(.5);opacity:0}}
.verdict{text-align:center;font-family:var(--display);font-size:clamp(22px,3.2vw,30px);font-weight:800}

/* rule cards */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.flip{perspective:900px;min-height:260px}
.flip .in{position:relative;width:100%;height:100%;min-height:260px;transition:transform .7s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;background:var(--paper)}
.flip .f{background:linear-gradient(135deg,#7A4CE0,#2F7BF5);color:#fff;font-family:var(--display);font-size:32px;font-weight:800;cursor:pointer;border:0}
.flip .f small{font-family:var(--body);font-size:15px;opacity:.9}
.flip .b{transform:rotateY(180deg)}
.frame{background:#FFF8E1;border:3px solid #F2C94C;border-radius:18px;padding:12px 16px;font-size:clamp(19px,2.4vw,24px);font-weight:800;text-align:center}

/* thumbs */
.thumbs{display:flex;gap:16px;justify-content:center;margin:12px 0}
.thumb{width:130px;height:110px;border-radius:24px;font-size:56px;box-shadow:0 6px 0 rgba(29,43,79,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.thumb small{font-family:var(--display);font-weight:800;font-size:18px;color:#fff;margin-top:4px}
.thumb.up{background:var(--good)}.thumb.down{background:var(--bad)}
.bigstate{font-family:var(--display);font-size:clamp(28px,5vw,48px);font-weight:800;text-align:center;margin:10px 0}

/* who / stamps */
.who{display:flex;gap:14px;align-items:flex-start;margin:10px 0;position:relative}
.avatar{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:32px;color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px var(--line)}
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-size:clamp(19px,2.6vw,24px);font-weight:800;min-width:0}
.bubble::before{content:"";position:absolute;left:-14px;top:22px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble .name{display:block;font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.stamp{position:absolute;right:4%;top:50%;font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,34px);color:var(--bad);border:5px solid var(--bad);border-radius:12px;padding:2px 14px;transform:translateY(-50%) rotate(-10deg) scale(3);opacity:0;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .2s;background:rgba(255,255,255,.85);pointer-events:none}
.stamp.on{transform:translateY(-50%) rotate(-10deg) scale(1);opacity:1}

/* pascal */
.pascal{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
.prow{display:flex;gap:6px}
.pc{width:clamp(36px,6.4vw,54px);height:clamp(36px,6.4vw,54px);border-radius:50%;background:var(--paper);border:3px solid var(--line);font-family:var(--display);font-weight:800;font-size:clamp(15px,2.6vw,22px);transition:background .3s,transform .2s,border-color .3s}
.pc.ev{background:var(--even);border-color:var(--even-ink);color:#fff;transform:scale(1.05)}
.pc.od{background:var(--odd-soft);border-color:var(--odd)}
.pc.shake{animation:shake .4s}
.pc.parent{box-shadow:0 0 0 5px var(--star)}
.pc.kid{box-shadow:0 0 0 5px var(--purple)}
.pascal.reveal .pc.ev{animation:glow 1.2s ease-in-out 2}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(47,123,245,.35);transform:scale(1.15)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.found{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.found > span{border-radius:999px;padding:6px 14px;font-weight:800;border:3px dashed var(--line);color:var(--soft)}
.found > span.got{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--ink)}

/* cards game */
.pcards{display:flex;gap:18px;justify-content:center;align-items:center;margin:10px 0}
.pcard{width:118px;height:160px;perspective:800px}
.pcard .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.pcard.on .in{transform:rotateY(180deg)}
.pcard .f,.pcard .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:4px solid #fff;box-shadow:0 6px 16px rgba(29,43,79,.2)}
.pcard .f{background:repeating-linear-gradient(45deg,#7A4CE0 0 12px,#8E66E8 12px 24px)}
.pcard .b{transform:rotateY(180deg);background:var(--paper);font-family:var(--display);font-size:54px;font-weight:800;line-height:1}

/* feedback */
.fb{margin-top:12px;border-radius:18px;padding:12px 16px;font-size:18px;font-weight:700;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;animation:fbin .3s}
@keyframes fbin{from{transform:translateY(8px);opacity:0}}
.fb.good{background:var(--good-soft);border:3px solid var(--good)}.fb.bad{background:var(--bad-soft);border:3px solid var(--bad)}.fb.info{background:var(--purple-soft);border:3px solid var(--purple)}
.fb .msg{flex:1;min-width:200px}.fb .face{font-size:30px;line-height:1}.fb .viz{width:100%}

/* odd lines board */
.olines{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.olines button{border-radius:12px;padding:6px 10px;font-weight:800;font-size:15px;background:#F1F5FB;color:var(--soft);border:2px solid var(--line)}
.olines button.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.olines button.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,64px));gap:5px;justify-content:center;margin:10px auto}
.g4 button{aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;background:#fff;font-family:var(--hand);font-size:34px;color:var(--pen)}
.tray{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.tray button{min-width:48px;height:52px;border-radius:14px;font-family:var(--display);font-size:24px;font-weight:800;color:#fff}
.tray .odd{background:var(--odd)}.tray .even{background:var(--even)}
.tray button.pick{outline:5px solid var(--star);outline-offset:2px}.tray button.used{opacity:.2;pointer-events:none}

/* win / certificate */
.cert{text-align:center;padding:10px 0}
.lwicd{max-width:720px;margin:14px auto;border-radius:12px;overflow:hidden;text-align:left}
.lwicd .t{background:#3F8F9C;color:#fff;font-weight:800;padding:10px 16px;font-size:20px}
.lwicd .bdy{background:#A0C9CF;padding:14px 16px;display:flex;gap:14px;align-items:center;font-weight:700;font-size:19px}
.lwicd .box{flex:none;width:40px;height:40px;background:#fff;border-radius:6px;display:grid;place-items:center;font-family:var(--hand);font-size:40px;color:var(--pen)}
.lwicd .box span{clip-path:inset(0 100% 0 0);animation:write .8s .6s steps(8,end) forwards}
.bigstars{font-size:60px;letter-spacing:8px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 1.9s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* answer book */
.booktabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.booktabs button{font-family:var(--display);font-weight:800;font-size:22px;padding:10px 22px;border-radius:16px;border:3px solid var(--line);background:var(--paper)}
.booktabs button.on.lb{background:var(--odd-soft);border-color:var(--odd)}.booktabs button.on.wb{background:#E7EBF1;border-color:#5B6B8F}
.pagehead{font-family:var(--display);font-weight:800;font-size:24px;margin-top:16px}
.modal{position:fixed;inset:0;background:rgba(29,43,79,.6);z-index:50;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.modal .inner{max-width:1100px;margin:0 auto}
.modal .closeb{position:sticky;top:0;z-index:10;display:flex;justify-content:flex-end;margin-bottom:8px}

@media (max-width:820px){
  .split{grid-template-columns:1fr}
}
@media (max-width:600px){
  body{font-size:17px}
  .hero{grid-template-columns:1fr;padding:18px}
  .card{padding:14px;border-radius:22px}
  .big{min-width:90px;font-size:21px;padding:8px 16px}
  .mascot{width:56px;height:56px}
  .step .t{display:none}
  .thumb{width:110px;height:96px;font-size:46px}
  .pcard{width:96px;height:132px}
  .cap i{width:30px;height:30px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.hw.go{clip-path:inset(0 0 0 0)}}
@media print{.bar,.booktabs,.noprint{display:none!important}body{background:#fff}.book{break-inside:avoid;box-shadow:none}}
</style>
<style>
/* ---------- Multiplication Builders: colour code ----------
   HUNDREDS = purple, TENS = blue, ONES = orange, THOUSANDS = green. ESTIMATE = teal. CARRY = pink pen. */
:root{--hun:#7A4CE0;--hun-ink:#5A2FC0;--hun-soft:#EEE7FF;--ten:#2F7BF5;--ten-ink:#1450B8;--ten-soft:#DCE9FF;--one:#FF7A3D;--one-ink:#B8410C;--one-soft:#FFE6D9;--tho:#1FA563;--tho-ink:#14804B;--tho-soft:#DDF6E8;--est:#00A3A3;--est-ink:#007373;--est-soft:#D9F5F5;--choc:#8B5A3C;--choc-d:#5A3420}
.hu{color:var(--hun-ink);font-weight:800}.te{color:var(--ten-ink);font-weight:800}.onx{color:var(--one-ink);font-weight:800}.th{color:var(--tho-ink);font-weight:800}.es{color:var(--est-ink);font-weight:800}.ca{color:var(--pen);font-weight:800}
.chip.qjump{font-size:18px;padding:6px 14px;min-height:40px;cursor:pointer;border:0}
.statement{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,30px);text-align:center;margin:6px 0}
/* chocolate bar */
.chocbar{display:grid;gap:3px;justify-content:center;margin:10px auto;transition:gap .5s}
.chocbar i{width:clamp(26px,5vw,40px);aspect-ratio:1;background:var(--choc);border:2px solid var(--choc-d);border-radius:4px;box-shadow:inset 3px 3px 0 rgba(255,255,255,.18),inset -3px -3px 0 rgba(0,0,0,.25);transition:margin .5s,box-shadow .4s}
.chocbar.cols i.gapr{margin-right:14px}.chocbar.rows i.gapb{margin-bottom:14px}
/* five bars and tens */
.fives{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;min-height:40px}
.five{display:inline-flex;gap:3px;padding:4px 6px;border-radius:999px;background:var(--one-soft);border:2px solid var(--one);animation:capin .35s backwards}
.five i{width:14px;height:14px;border-radius:50%;background:var(--one);display:block}
.tenbox{display:inline-flex;flex-direction:column;gap:4px;align-items:center;padding:6px 8px 4px;border-radius:14px;border:3px solid var(--ten);background:var(--ten-soft);animation:capin .4s backwards;position:relative}
.tenbox .five{animation:none}
.tenbox b{font-family:var(--display);font-size:18px;line-height:1;color:var(--ten-ink)}
.tenbox.lit{background:var(--star);border-color:#C79300}
/* chain of factors (associative law) */
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin:12px 0}
.ccard{min-width:64px;height:68px;padding:0 12px;border-radius:16px;background:#fff;border:4px solid var(--ink);font-family:var(--display);font-size:34px;font-weight:800;display:grid;place-items:center;box-shadow:0 5px 0 rgba(29,43,79,.2);animation:capin .4s backwards}
.ccard.split{border-style:dashed;border-color:var(--purple);color:var(--purple)}
.ccard.pk{outline:5px solid var(--star);outline-offset:2px}
.ccard.ten{background:var(--star);border-color:#C79300}
.cx{width:52px;height:52px;border-radius:50%;background:var(--purple-soft);border:3px solid var(--purple);font-family:var(--display);font-size:28px;font-weight:800;color:var(--purple);position:relative}
.cx::after{content:"tap";position:absolute;left:50%;top:100%;transform:translateX(-50%);font-family:var(--body);font-size:11px;font-weight:800;color:var(--soft)}
.cx.hintme{animation:hint 1.4s ease-in-out infinite}
.cx[disabled]{opacity:.35}
.clog{font-family:var(--display);font-size:clamp(22px,3vw,28px);font-weight:800;text-align:center;line-height:1.35}
.clog div{animation:fbin .3s}
/* base ten blocks */
.blocks{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:flex-end;justify-content:center;--u:4px}
.b-h{width:calc(var(--u)*10);height:calc(var(--u)*10);background-color:var(--hun);border:1.5px solid var(--hun-ink);border-radius:2px;background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:var(--u) var(--u);display:block}
.b-t{width:var(--u);height:calc(var(--u)*10);min-width:5px;background:var(--ten);border:1.5px solid var(--ten-ink);border-radius:2px;display:block;background-image:linear-gradient(rgba(255,255,255,.45) 1px,transparent 1px);background-size:100% var(--u)}
.b-o{width:var(--u);height:var(--u);min-width:5px;min-height:5px;background:var(--one);border:1.5px solid var(--one-ink);border-radius:2px;display:block}
.brow{display:flex;gap:6px;align-items:flex-end;justify-content:center;margin:2px 0;animation:capin .35s backwards}
.brow .blocks{flex-wrap:nowrap}
/* grid method */
.gridm{border-collapse:separate;border-spacing:0;margin:10px auto;font-family:var(--display);font-weight:800}
.gridm th,.gridm td{border:3px solid var(--ink);padding:6px 8px;text-align:center;vertical-align:middle;min-width:70px}
.gridm th{font-size:clamp(22px,3.4vw,30px);background:#F4F8FE}
.gridm th.hx{background:#fff;color:var(--soft)}
.gridm th.ph{background:var(--hun-soft);color:var(--hun-ink)}.gridm th.pt{background:var(--ten-soft);color:var(--ten-ink)}.gridm th.po{background:var(--one-soft);color:var(--one-ink)}
.gridm td{background:#fff;min-height:60px}
.gridm td.cell{cursor:default}
.gridm td .val{display:block;font-size:clamp(22px,3.4vw,30px);color:var(--pen);font-family:var(--hand);min-height:1.1em}
.gridm td.now{box-shadow:inset 0 0 0 4px var(--star)}
.gridm td.got{background:var(--good-soft)}
.sumline{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,30px);text-align:center;margin:8px 0}
/* column method with place value counters */
.colm{display:grid;gap:0;justify-content:center;margin:10px auto;font-family:var(--display);font-weight:800}
.colm .c{width:clamp(44px,8vw,62px);height:clamp(48px,8vw,62px);display:grid;place-items:center;font-size:clamp(26px,4.4vw,36px);border:1px dashed #C9D8EE}
.colm .hd{font-size:14px;height:30px;border:0;color:#fff;border-radius:8px 8px 0 0}
.colm .ans{border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);color:var(--pen);font-family:var(--hand)}
.colm .car{height:34px;font-size:22px;color:var(--pen);font-family:var(--hand);border:0}
.colm .now{background:#FFF6C9}
.colm .pop{animation:popin .5s}
@keyframes popin{0%{transform:scale(2);opacity:0}100%{transform:scale(1);opacity:1}}
.mat{display:grid;gap:6px;justify-content:center;margin:8px auto;max-width:100%}
.matcol{border-radius:14px;border:3px solid var(--mc);background:color-mix(in srgb,var(--mc) 10%,#fff);padding:6px 4px;min-height:90px;display:flex;flex-direction:column;align-items:center;gap:4px;width:clamp(70px,20vw,130px)}
.matcol>b{font-size:13px;color:var(--mc);text-transform:uppercase;letter-spacing:.04em}
.frames{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.tf{display:grid;grid-template-columns:repeat(5,var(--cs,14px));gap:2px;padding:2px;border-radius:6px;border:2px solid transparent;transition:transform .5s,opacity .5s}
.tf.full{border-color:var(--mc);background:#fff}
.tf.glow{box-shadow:0 0 0 4px var(--star);animation:glow 1s ease-in-out infinite}
.tf.fly{transform:translateX(calc(-1 * var(--fx,120px))) scale(.2);opacity:0}
.tf i{width:var(--cs,14px);height:var(--cs,14px);border-radius:50%;background:var(--mc);display:block}
.tf i.cin{box-shadow:0 0 0 3px var(--pen)}
.tf i.new{animation:capin .4s backwards}
.mcount{font-family:var(--display);font-size:20px;line-height:1;color:var(--mc)}
/* number line for estimates */
.eline{display:block;width:100%;max-width:720px;margin:6px auto}
.eline text{font-family:var(--display);font-weight:800}
.estbox{display:inline-block;border:3px solid var(--est);background:var(--est-soft);color:var(--est-ink);border-radius:14px;padding:4px 14px;font-family:var(--display);font-weight:800;font-size:22px}
.chooser{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.qhead{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,44px);text-align:center;margin:4px 0}
.parts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.parts .test{flex:1;min-width:240px;max-width:520px}
.stepsay{text-align:center;font-weight:800;font-size:19px;color:var(--soft);margin:4px 0}
/* digit cards */
.dcards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.dcard{width:56px;height:64px;border-radius:10px;border:4px solid var(--c,#C2185B);background:var(--b,#F3D1E2);color:var(--c,#C2185B);font-family:var(--display);font-size:32px;font-weight:800;box-shadow:3px 3px 0 rgba(29,43,79,.25)}
.dcard.pick{outline:5px solid var(--star);outline-offset:2px}.dcard.used{opacity:.18;pointer-events:none}
.slots{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0;font-family:var(--display);font-weight:800;font-size:30px}
.slots button{width:56px;height:64px;border-radius:10px;border:3px dashed var(--line);background:#fff;font-family:var(--display);font-size:32px;font-weight:800}
.slots button.full{border-style:solid;border-color:var(--c,#C2185B);color:var(--c,#C2185B);background:var(--b,#F3D1E2)}
/* triangles (workbook Q2) */
.tri{display:block;width:100%;max-width:360px;margin:6px auto}
.tri text{font-family:var(--display);font-weight:800}
.tris{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.bigpick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.bigpick button{min-width:150px;padding:10px 16px;border-radius:16px;background:#fff;border:3px solid var(--line);font-family:var(--display);font-size:26px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.bigpick button.yes{background:var(--good-soft);border-color:var(--good)}.bigpick button.no{background:var(--bad-soft);border-color:var(--bad);opacity:.7}
.machine{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-family:var(--display);font-weight:800;font-size:28px;margin:8px 0}
.machine .box{border:4px solid var(--good);background:var(--good-soft);border-radius:16px;padding:8px 18px}
.machine .io{min-width:90px;text-align:center;border:3px solid var(--line);border-radius:14px;padding:6px 10px;background:#fff}
.machine .arrow{font-size:34px;color:var(--soft)}
.mtab{border-collapse:collapse;margin:8px auto;font-family:var(--display);font-weight:800;font-size:24px}
.mtab th,.mtab td{border:3px solid var(--ink);padding:4px 18px;text-align:center;min-width:110px}
.mtab th{background:#F7C9A0}.mtab td.got{color:var(--pen);font-family:var(--hand);font-size:28px}
.mtab tr.now td{background:#FFF6C9}
.facts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.facts button{width:56px;height:56px;border-radius:50%;background:#fff;border:3px solid var(--line);font-family:var(--display);font-size:24px;font-weight:800}
.facts button.yes{background:var(--good);border-color:#14804B;color:#fff}.facts button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.book svg.lines ellipse{fill:none;stroke:var(--pen);stroke-width:6;stroke-dasharray:700;stroke-dashoffset:700;animation:draw .7s ease forwards}
.book .patch{position:absolute;background:#fff;border-radius:40%;box-shadow:0 0 6px 4px #fff;z-index:2;opacity:0;transition:opacity .4s}
.book .patch.on{opacity:.97}
.book .hw{z-index:3}
@media (max-width:600px){.ccard{min-width:52px;height:58px;font-size:28px}.cx{width:44px;height:44px}.gridm th,.gridm td{min-width:52px;padding:4px}.dcard,.slots button{width:46px;height:54px;font-size:26px}}
</style>

<script>
(function(){
"use strict";
var app=document.getElementById('app');
var IMG=window.FBH_IMG_BASE||'img/';
var X='×',DV='÷';

SAVE.done=SAVE.done||{};SAVE.stars=SAVE.stars||{};

/* ---------- sound + voice ---------- */
var muted=!!SAVE.muted,ac=null;
function tone(freqs,dur,type){
  if(muted)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain();o.type=type||'triangle';o.frequency.value=f;var t=ac.currentTime+i*dur;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02)});
  }catch(e){}
}
var sGood=function(){tone([523,659,784],.1)},sBad=function(){tone([300,220],.15,'sine')},sWin=function(){tone([523,659,784,1047,784,1047,1319],.11)},sPop=function(){tone([660,880],.06)},sWrite=function(){tone([1200,1500,1800],.05,'sine')},sSnap=function(){tone([392,523,784],.07)};

/* ---------- helpers ---------- */
function h(tag,attrs,kids){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null)continue;
    if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);else if(k==='style')el.style.cssText=v;else el.setAttribute(k,v)}
  (kids||[]).forEach(function(c){if(c==null)return;el.appendChild(typeof c==='string'?document.createTextNode(c):c)});
  return el;
}

function sv(tag,attrs,txt){var el=document.createElementNS(SVGNS,tag);for(var k in attrs)el.setAttribute(k,attrs[k]);if(txt!=null)el.textContent=txt;return el}

/* Chocolate bar: r rows, c columns. Split into columns (r × c read as c lots of r) or into rows. */

}

/* Fives: n groups of 5 dots. pair() puts every two fives into a ten. */
function fiveBar(){var f=h('span',{class:'five'});for(var i=0;i<5;i++)f.appendChild(h('i'));return f}

  var el=h('div',{class:'fives'});host.appendChild(el);

  return api;

/* Chain: numbers joined by ×. Tap a × to multiply those two numbers first (the associative law).
   opts.split = {18:[9,2]} lets a number be broken into factors first. opts.only = the × that must be used. */
function Chain(host,api,nums,opts){
  opts=opts||{};
  var wrap=h('div',{class:'test'});host.appendChild(wrap);
  if(opts.title)wrap.appendChild(h('div',{class:'stepsay',html:opts.title}));
  var row=h('div',{class:'chain'}),qa=h('div'),log=h('div',{class:'clog'});
  wrap.appendChild(row);wrap.appendChild(qa);wrap.appendChild(log);
  var cur=nums.slice(),splitLeft=0,busy=false,first=true,steps=0;
  if(opts.split)for(var k in opts.split)if(cur.indexOf(+k)>=0)splitLeft++;
  function addLog(){log.appendChild(h('div',null,[(first?'':'= ')+cur.join(' '+X+' ')]));first=false}
  function draw(){
    row.innerHTML='';
    cur.forEach(function(v,i){
      var canSplit=opts.split&&opts.split[v]&&splitLeft>0;
      var c=h(canSplit?'button':'div',{class:'ccard'+(canSplit?' split':'')+(steps>0&&v%10===0&&cur.length>1?' ten':'')},[String(v)]);
      if(canSplit){c.onclick=function(){split(i)};c.setAttribute('aria-label','Break '+v+' into factors')}
      row.appendChild(c);
      if(i<cur.length-1){
        var x=h('button',{class:'cx'+(splitLeft===0&&(opts.only==null||steps>0||opts.only===i)&&opts.hint!==false?' hintme':''),'aria-label':'Multiply '+v+' and '+cur[i+1]+' first'},[X]);
        if(splitLeft>0)x.disabled=true;
        x.onclick=function(){merge(i)};row.appendChild(x);
      }
    });
  }
  function split(i){var v=cur[i],f=opts.split[v];cur.splice(i,1,f[0],f[1]);splitLeft--;sSnap();addLog();draw();
    if(opts.onSplit)opts.onSplit(v,f)}
  function merge(i){
    if(busy||cur.length<2)return;
    if(opts.only!=null&&steps===0&&i!==opts.only){api.miss();sBad();feedback(qa,'bad',opts.onlyWhy||'Use the other '+X+' sign.');return}
    busy=true;var a=cur[i],b=cur[i+1],p=a*b;qa.innerHTML='';
    Array.prototype.forEach.call(row.querySelectorAll('.cx'),function(x){x.disabled=true;x.classList.remove('hintme')});var cs=row.querySelectorAll('.ccard');cs[i].classList.add('pk');cs[i+1].classList.add('pk');
    qa.appendChild(h('div',{class:'statement',html:a+' '+X+' '+b+' = ?'}));
    var hint=null;
    if(a===2&&b===5||a===5&&b===2)hint='2 '+X+' 5 = 10. A ten!';
    choiceQ(qa,api,numChoices(p,[p+a,p-b,a+b,p+10,p*10>999?p-a:p*10]).map(function(v){return {label:String(v),ok:v===p,why:a+' '+X+' '+b+' is not '+v+'. Count in '+Math.min(a,b)+'s: '+countIn(Math.min(a,b),Math.max(a,b))+'.'}}),function(){
      later(function(){
        qa.innerHTML='';cur.splice(i,2,p);steps++;sSnap();addLog();draw();busy=false;
        if(hint)qa.appendChild(h('div',{class:'stepsay',html:hint}));
        if(cur.length===1){if(opts.done)opts.done(p)}else if(opts.onMerge)opts.onMerge(a,b,p);
      },350);
    },{cls:function(){return 'big plain'}});
  }
  addLog();draw();
  return {el:wrap};
}
function countIn(s,k){if(k>12)return s+', '+(2*s)+', '+(3*s)+' …';var a=[];for(var i=1;i<=k;i++)a.push(s*i);return a.join(', ')}

/* Rounding on a number line. Is n closer to the ten (or hundred) below or above? */
function RoundLine(host,api,n,done){
  var big=n>=100,step=big?100:10,lo=Math.floor(n/step)*step,hi=lo+step,r=(n-lo)*2>=step?hi:lo;
  var box=h('div',{class:'test'});host.appendChild(box);
  box.appendChild(h('div',{class:'stepsay',html:'Round <b>'+n+'</b> to the nearest '+(big?'<span class="hu">hundred</span>':'<span class="te">ten</span>')+'.'}));
  if(n%step===0){box.appendChild(h('div',{class:'statement',html:n+' is already a '+(big?'hundreds':'tens')+' number!'}));later(function(){done(n)},300);return}
  var W=720,x=function(v){return 50+(v-lo)/(hi-lo)*620};
  var svg=sv('svg',{viewBox:'0 0 '+W+' 150',class:'eline',role:'img','aria-label':'Number line from '+lo+' to '+hi});
  svg.appendChild(sv('line',{x1:30,y1:90,x2:690,y2:90,stroke:'#1D2B4F','stroke-width':5,'stroke-linecap':'round'}));
  for(var t=0;t<=10;t++){var v=lo+t*step/10,X0=x(v),big5=t===5,end=t===0||t===10;
    svg.appendChild(sv('line',{x1:X0,y1:end?66:big5?72:78,x2:X0,y2:end?114:big5?108:102,stroke:big5?'#7A4CE0':'#1D2B4F','stroke-width':end?5:3,'stroke-dasharray':big5?'5 4':''}));
    if(end)svg.appendChild(sv('text',{x:X0,y:140,'text-anchor':'middle','font-size':30,fill:'#1D2B4F'},String(v)));
    else if(big5)svg.appendChild(sv('text',{x:X0,y:134,'text-anchor':'middle','font-size':17,fill:'#7A4CE0'},'halfway '+v));
  }
  var px=x(n);
  svg.appendChild(sv('circle',{cx:px,cy:90,r:13,fill:'#00A3A3',stroke:'#1D2B4F','stroke-width':3}));
  svg.appendChild(sv('text',{x:px,y:48,'text-anchor':'middle','font-size':34,fill:'#007373'},String(n)));
  box.appendChild(svg);
  var q=h('div');box.appendChild(q);
  q.appendChild(h('p',{class:'task',style:'text-align:center',html:'Is '+n+' closer to '+lo+' or '+hi+'?'}));
  choiceQ(q,api,[lo,hi].map(function(v){return {label:String(v),ok:v===r,why:n+' is '+Math.abs(n-v)+' away from '+v+' but only '+Math.abs(n-r)+' away from '+r+'.'+((n-lo)*2===step?' Halfway numbers round up.':'')}}),function(){
    var p=sv('path',{d:'M'+px+' 76 Q'+((px+x(r))/2)+' 14 '+x(r)+' 76',fill:'none',stroke:'#D81B60','stroke-width':5,'stroke-linecap':'round','stroke-dasharray':'400','stroke-dashoffset':'400',style:'animation:draw .7s ease forwards'});svg.appendChild(p);
    svg.appendChild(sv('circle',{cx:x(r),cy:90,r:11,fill:'#FFC21A',stroke:'#1D2B4F','stroke-width':3}));
    q.appendChild(h('div',{class:'statement',html:n+' rounds to <span class="es">'+r+'</span>'}));
    later(function(){done(r)},500);
  },{cls:function(){return 'big plain'}});
}
/* Estimate n × m: round n, then multiply the rounded number */
function Estimate(host,api,n,m,done){
  RoundLine(host,api,n,function(r){
    var q=h('div',{class:'test'});host.appendChild(q);
    q.appendChild(h('div',{class:'stepsay',html:'Now multiply the easy number: <b>'+r+' '+X+' '+m+'</b>'}));
    var E=r*m,base=r/Math.pow(10,pvIndex(r)),w=PLACE[pvIndex(r)];
    choiceQ(q,api,numChoices(E,[E+r,E-r,r+m,E*10,E/10]).map(function(v){return {label:String(v),ok:v===E,why:'Think: '+base+' '+X+' '+m+' = '+(base*m)+', so '+base+' '+w+' '+X+' '+m+' = '+(base*m)+' '+w+'.'}}),function(){
      q.appendChild(h('div',{class:'statement',html:'<span class="estbox">Estimate: about '+E+'</span>'}));
      later(function(){done(E)},400);
    },{cls:function(){return 'big plain'}});
  });
}

/* GRID METHOD with base ten blocks. Each cell shows the blocks for m rows of that part. */
function GridMethod(host,api,n,m,done){
  var P=parts(n),U=(n>=100||m>6)?3:4;
  var box=h('div',{class:'test'});host.appendChild(box);
  box.appendChild(h('div',{class:'stepsay',html:'<b>Grid method</b>: '+n+' '+X+' '+m}));
  var say=h('div',{class:'statement',style:'font-size:22px'});box.appendChild(say);
  var scroller=h('div',{style:'overflow-x:auto'});var tbl=h('table',{class:'gridm'});scroller.appendChild(tbl);box.appendChild(scroller);
  var tr1=h('tr'),tr2=h('tr');tbl.appendChild(tr1);tbl.appendChild(tr2);
  tr1.appendChild(h('th',{class:'hx'},[X]));
  var heads=P.map(function(v){var c=h('th',{class:['po','pt','ph','ph'][pvIndex(v)]},['?']);tr1.appendChild(c);return c});
  tr2.appendChild(h('th',{class:'hx',style:'color:var(--ink)'},[String(m)]));
  var cells=P.map(function(){var c=h('td',{class:'cell'});tr2.appendChild(c);return c});
  var q=h('div');box.appendChild(q);
  var sumEl=h('div',{class:'sumline'});box.appendChild(sumEl);
  /* step 1: break the number up */
  say.innerHTML='Break <b>'+n+'</b> into '+(n>=100?'<span class="hu">hundreds</span>, ':'')+'<span class="te">tens</span> and <span class="onx">ones</span>.';
  var right=P.join(' + '),dig=String(n).split('').join(' + ');
  var opts=[{label:n+' = '+right,ok:true}];
  if(dig!==right)opts.push({label:n+' = '+dig,why:'The '+String(n)[0]+' is worth '+P[0]+', not '+String(n)[0]+'. Look at the blocks!'});
  if(n>=100)opts.push({label:n+' = '+Math.floor(n/10)+' + '+(n%10),why:'Split it into hundreds, tens and ones: '+right+'.'});
  else opts.push({label:n+' = '+n+' + 0',why:'Split it into tens and ones: '+right+'.'});
  q.appendChild(blocksNum(n,4));
  choiceQ(q,api,shuffle(opts),function(){
    P.forEach(function(v,j){heads[j].innerHTML='';heads[j].appendChild(h('div',null,[String(v)]));heads[j].appendChild(blocksFor(v,3))});sSnap();
    later(function(){q.innerHTML='';say.innerHTML='Now build it <b>'+m+'</b> times: '+m+' rows.';
      var b=h('button',{class:'big both'},['✨ Make '+m+' rows']);q.appendChild(h('div',{class:'row center'},[b]));
      b.onclick=function(){q.innerHTML='';
        P.forEach(function(v,j){for(var r=0;r<m;r++){var br=h('div',{class:'brow'});br.style.animationDelay=(r*.08+j*.1)+'s';br.appendChild(blocksFor(v,U));cells[j].appendChild(br)}cells[j].appendChild(h('span',{class:'val'},['']))});
        sPop();later(function(){cellStep(0)},m*80+400)};
    },500);
  },{col:true});
  function cellStep(j){
    if(j>=P.length){addStep();return}
    cells.forEach(function(c){c.classList.remove('now')});cells[j].classList.add('now');
    var v=P[j],p=pvIndex(v),d=v/Math.pow(10,p),ans=v*m;
    say.innerHTML=m+' '+X+' '+(p?d+' '+(d===1?PLACE1[p]:PLACE[p])+' = '+(d*m)+' '+PLACE[p]:d)+' &nbsp;→&nbsp; '+m+' '+X+' '+v+' = ?';
    q.innerHTML='';
    choiceQ(q,api,numChoices(ans,[ans+v,ans-v,v+m,p?d*m:ans*10,ans*10]).map(function(x){return {label:String(x),ok:x===ans,why:p?'Count the '+PLACE[p]+' in the cell: '+m+' rows of '+d+' = '+(d*m)+' '+PLACE[p]+' = '+ans+'.':'Count the ones: '+m+' rows of '+d+'.'}}),function(){
      cells[j].querySelector('.val').textContent=String(ans);cells[j].classList.remove('now');cells[j].classList.add('got');sWrite();
      later(function(){cellStep(j+1)},450);
    },{cls:function(){return 'big plain'}});
  }
  function addStep(){
    var vals=P.map(function(v){return v*m}),tot=n*m;
    if(vals.length===1){q.innerHTML='';say.innerHTML='<b>'+n+' '+X+' '+m+' = '+tot+'</b>';later(function(){done(tot)},400);return}
    say.innerHTML='Add the answers together.';q.innerHTML='';
    sumEl.innerHTML=vals.join(' + ')+' = ?';
    choiceQ(q,api,numChoices(tot,[tot+10,tot-10,tot+100,tot-100]).map(function(x){return {label:String(x),ok:x===tot,why:'Add the biggest first: '+vals.join(' + ')+'. Try again!'}}),function(){finish()},{cls:function(){return 'big plain'}});
    function finish(){q.innerHTML='';sumEl.innerHTML=vals.join(' + ')+' = <span style="color:var(--pen)">'+tot+'</span>';say.innerHTML='<b>'+n+' '+X+' '+m+' = '+tot+'</b>';sGood();later(function(){done(tot)},400)}
  }
}

/* COLUMN (compact) METHOD with place value counters. 10 counters in one column are swapped for 1 counter
   in the next column: that is the carry. */
function ColumnMethod(host,api,n,m,done){
  var nd=String(n).length,prod=n*m,cols=Math.max(nd,String(prod).length);
  var box=h('div',{class:'test'});host.appendChild(box);
  box.appendChild(h('div',{class:'stepsay',html:'<b>Compact method</b>: '+n+' '+X+' '+m+'. Start with the <span class="onx">ones</span>!'}));
  var say=h('div',{class:'statement',style:'font-size:22px'});box.appendChild(say);
  var g=h('div',{class:'colm'});g.style.gridTemplateColumns='repeat('+(cols+1)+',auto)';box.appendChild(g);
  var numC=[],ansC=[],carC=[];
  function cell(cls,txt){var c=h('div',{class:'c '+(cls||'')},[txt==null?'':String(txt)]);g.appendChild(c);return c}
  cell('hd','');for(var p=cols-1;p>=0;p--){var hc=cell('hd',PSHORT[p]);hc.style.background=PCOL[p]}
  cell('','');for(p=cols-1;p>=0;p--)numC[p]=cell('',p<nd?digitAt(n,p):'');
  cell('',X);for(p=cols-1;p>=0;p--)cell('',p===0?m:'');
  cell('ans','');for(p=cols-1;p>=0;p--)ansC[p]=cell('ans','');
  cell('car','');for(p=cols-1;p>=0;p--)carC[p]=cell('car','');
  var mat=h('div',{class:'mat'});mat.style.gridTemplateColumns='repeat('+cols+',auto)';box.appendChild(mat);
  var mc=[];
  for(p=cols-1;p>=0;p--){var c=h('div',{class:'matcol'});c.style.setProperty('--mc',PCOL[p]);c.appendChild(h('b',null,[PLACE[p]]));var fr=h('div',{class:'frames'});c.appendChild(fr);var cnt=h('div',{class:'mcount'});c.appendChild(cnt);mat.appendChild(c);mc[p]={el:c,fr:fr,cnt:cnt,n:0}}
  function drawMat(p,count,carried,fresh){
    var M=mc[p];M.n=count;M.fr.innerHTML='';var cs=count>40?11:14;
    for(var f=0;f*10<count;f++){
      var t=h('div',{class:'tf'+(count-f*10>=10?' full':'')});t.style.setProperty('--cs',cs+'px');
      for(var i=f*10;i<Math.min(count,f*10+10);i++){var dot=h('i',{class:(i>=count-carried?'cin':'')+(fresh&&i<count-carried?' new':'')});if(fresh)dot.style.animationDelay=(i*.025)+'s';t.appendChild(dot)}
      M.fr.appendChild(t);
    }
    M.cnt.textContent=count?String(count):'';
  }
  var q=h('div');box.appendChild(q);
  var carry=0;
  function stepPlace(p){
    for(var k=0;k<cols;k++){numC[k].classList.remove('now');ansC[k].classList.remove('now')}
    if(p>=nd){
      if(carry){ansC[p].classList.add('now');say.innerHTML='No more digits to multiply. Write the <span class="ca">'+carry+'</span> you carried.';
        q.innerHTML='';var b=h('button',{class:'big go'},['✍ Write '+carry]);q.appendChild(h('div',{class:'row center'},[b]));
        b.onclick=function(){ansC[p].textContent=String(carry);ansC[p].classList.add('pop');sWrite();q.innerHTML='';finish()};return}
      finish();return;
    }
    numC[p].classList.add('now');ansC[p].classList.add('now');
    var d=digitAt(n,p),pr=d*m,tot=pr+carry,w=PLACE[p];
    say.innerHTML='Multiply the '+'<span style="color:'+PCOL[p]+'">'+w+'</span>: '+m+' '+X+' '+d+' '+w+' = ?';
    q.innerHTML='';
    choiceQ(q,api,numChoices(pr,[pr+m,pr-m,d+m,pr+1,pr+10]).map(function(x){return {label:String(x),ok:x===pr,why:m+' '+X+' '+d+' is not '+x+'. Count in '+m+'s: '+countIn(m,d||1)+'.'}}),function(){
      var old=carry;drawMat(p,tot,old,true);sPop();
      later(function(){q.innerHTML='';
        if(old){say.innerHTML=pr+' '+w+' + the <span class="ca">'+old+'</span> carried = ?';
          choiceQ(q,api,numChoices(tot,[tot+1,tot-1,tot+10,pr]).map(function(x){return {label:String(x),ok:x===tot,why:'Count all the counters in the '+w+' column. '+pr+' + '+old+' = '+tot+'.'}}),function(){later(function(){exch(p,tot)},300)},{cls:function(){return 'big plain'}});
        }else exch(p,tot);
      },500);
    },{cls:function(){return 'big plain'}});
  }
  function exch(p,tot){
    q.innerHTML='';var w=PLACE[p];
    if(tot<10){say.innerHTML=tot+' '+w+'. Less than 10, so no swap. Write <b>'+tot+'</b>.';ansC[p].textContent=String(tot);ansC[p].classList.add('pop');sWrite();carry=0;
      q.appendChild(h('div',{class:'next-row'},[h('button',{class:'big go small',onclick:function(){stepPlace(p+1)}},['Next column →'])]));return}
    var k=Math.floor(tot/10),r=tot%10;
    say.innerHTML=tot+' '+w+'! Make groups of 10. <b>10 '+w+' = 1 '+PLACE1[p+1]+'</b>.';
    Array.prototype.forEach.call(mc[p].fr.querySelectorAll('.tf.full'),function(t){t.classList.add('glow')});
    var b=h('button',{class:'big both'},['🔄 Swap '+(k*10)+' '+w+' for '+k+' '+(k===1?PLACE1[p+1]:PLACE[p+1])]);q.appendChild(h('div',{class:'row center'},[b]));
    b.onclick=function(){b.disabled=true;
      var dx=(mc[p].el.getBoundingClientRect().left-mc[p+1].el.getBoundingClientRect().left)||120;
      Array.prototype.forEach.call(mc[p].fr.querySelectorAll('.tf.full'),function(t){t.style.setProperty('--fx',dx+'px');t.classList.remove('glow');t.classList.add('fly')});
      sSnap();
      later(function(){
        drawMat(p,r,0,false);drawMat(p+1,k,k,true);
        ansC[p].textContent=String(r);ansC[p].classList.add('pop');carC[p+1].textContent=String(k);carC[p+1].classList.add('pop');sWrite();
        carry=k;q.innerHTML='';
        say.innerHTML='Write <b>'+r+'</b> in the '+w+'. Carry <span class="ca">'+k+'</span> '+(k===1?PLACE1[p+1]:PLACE[p+1])+'.';
        q.appendChild(h('div',{class:'next-row'},[h('button',{class:'big go small',onclick:function(){stepPlace(p+1)}},['Next column →'])]));
      },650);
    };
  }
  function finish(){
    for(var k=0;k<cols;k++){numC[k].classList.remove('now');ansC[k].classList.remove('now')}
    say.innerHTML='<b>'+n+' '+X+' '+m+' = '+prod+'</b>';sGood();later(function(){done(prod)},400);
  }
  stepPlace(0);
}

/* Solve: estimate first, then a method (grid or column), then check against the estimate. */
function Solve(host,api,n,m,done,opts){
  opts=opts||{};
  var area=h('div');host.appendChild(area);
  area.appendChild(h('div',{class:'qhead'},[n+' '+X+' '+m]));
  var est=null;
  function method(){
    if(opts.method){run(opts.method);return}
    var ch=h('div',{class:'test'});area.appendChild(ch);
    ch.appendChild(h('div',{class:'stepsay'},['Choose your method. Use the one you understand best!']));
    var r=h('div',{class:'chooser'});ch.appendChild(r);
    [['grid','▦ Grid method'],['column','🧮 Compact method']].forEach(function(o){r.appendChild(h('button',{class:'big '+(o[0]==='grid'?'plain':'plain'),onclick:function(){ch.remove();run(o[0])}},[o[1]]))});
  }
  function run(k){(k==='grid'?GridMethod:ColumnMethod)(area,api,n,m,check)}
  function check(ans){
    var msg='<b>'+n+' '+X+' '+m+' = '+ans+'</b>';
    if(est!=null)msg+='<br>Check: '+ans+' is close to our estimate of <span class="es">'+est+'</span>. ✓ It makes sense!';
