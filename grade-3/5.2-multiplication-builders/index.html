<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>window.FBH_STANDALONE=true;</script>
<title>Multiplication Builders</title><link rel="icon" type="image/png" href="../../assets/favicon.png"><link rel="apple-touch-icon" href="../../assets/insightia-logo.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&family=Gochi+Hand&display=swap">
<style>
/* Layout: lesson map -> one lesson at a time, five steps per lesson.
   The real book page is always on screen; answers are hand-written into its blanks.
   Colour code everywhere: FACTOR = purple, MULTIPLE = orange, PRODUCT = blue. One bright look, chosen on purpose for projectors. */
:root{
  --bg:#EAF4FF; --paper:#FFFFFF; --ink:#1D2B4F; --soft:#5B6B8F; --line:#C9D8EE;
  --odd:#FF7A3D; --odd-soft:#FFE6D9; --odd-ink:#B8410C;
  --even:#2F7BF5; --even-soft:#DCE9FF; --even-ink:#1450B8;
  --good:#1FA563; --good-soft:#DDF6E8; --bad:#E5484D; --bad-soft:#FFE3E3;
  --star:#FFC21A; --purple:#7A4CE0; --purple-soft:#EEE7FF; --pen:#D81B60;
  --e1:#E0559B; --e2:#FF7A3D; --e3:#2F7BF5; --e4:#1FA563; --e5:#7A4CE0;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --hand:"Gochi Hand","Comic Sans MS","Segoe Print",cursive;
  color-scheme:light;
}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 12px 12px,rgba(47,123,245,.07) 3px,transparent 4px);background-size:28px 28px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--purple);outline-offset:3px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 60px}
.o{color:var(--odd-ink);font-weight:800}.e{color:var(--even-ink);font-weight:800}
.sub{color:var(--soft);font-size:16px;margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:14px}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.pill:hover{border-color:var(--purple)} .pill.on{background:var(--purple-soft);border-color:var(--purple)}

/* buttons */
.big{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:60px;min-width:110px;padding:10px 24px;border-radius:18px;font-family:var(--display);font-weight:800;font-size:24px;border:3px solid transparent;box-shadow:0 5px 0 rgba(29,43,79,.2);transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(29,43,79,.2)}
.big.odd{background:var(--odd);color:#fff}.big.even{background:var(--even);color:#fff}.big.both{background:var(--purple);color:#fff}
.big.plain{background:var(--paper);border-color:var(--line)}.big.go{background:var(--good);color:#fff}.big.no{background:var(--bad);color:#fff}
.big.sel{outline:5px solid var(--star);outline-offset:2px}
.big.small{min-height:48px;font-size:19px;padding:6px 16px;min-width:0}
.big[disabled]{opacity:.4;pointer-events:none}
.opt{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 18px;font-size:20px;font-weight:800;min-height:58px;text-align:left;box-shadow:0 4px 0 var(--line)}
.opt:hover{border-color:var(--purple)}.opt.right{background:var(--good-soft);border-color:var(--good)}.opt.wrongpick{background:var(--bad-soft);border-color:var(--bad)}
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.choices.col{flex-direction:column;align-items:stretch;max-width:640px;margin-inline:auto}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:var(--paper);border-radius:30px;padding:22px 26px;border:3px solid var(--line);position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,5.6vw,58px);font-weight:800}
.tag{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:18px}
.day{text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s;position:relative}
.day:hover{transform:translateY(-3px);border-color:var(--c,var(--purple))}
.day .when{font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.day h2{font-size:28px}
.day .goal{background:#F4F8FE;border-radius:14px;padding:8px 12px;font-weight:700;font-size:16px}
.epath{display:flex;gap:6px;flex-wrap:wrap}
.echip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;font-weight:800;color:#fff;background:var(--ec)}
.echip b{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center;font-size:12px}
.echip.done::after{content:"\2713";margin-left:2px}
.daystars{font-size:22px;letter-spacing:2px}
.star-on{color:var(--star)}.star-off{color:#D5DEEC}
.mini-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}

/* mascot + speech */
.guide{display:flex;gap:12px;align-items:flex-start;margin:6px 0 10px}
.mascot{flex:none;width:76px;height:76px;animation:bob 2.4s ease-in-out infinite}
.mascot.huge{width:120px;height:120px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.say{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-size:clamp(19px,2.4vw,23px);font-weight:800;min-width:0;flex:1;max-width:760px}
.say::before{content:"";position:absolute;left:-14px;top:22px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}
.say .spk{float:right;margin:-4px -6px 4px 8px;width:42px;height:42px;border-radius:50%;background:var(--purple-soft);font-size:20px}
.say .nm{display:block;font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}

/* lesson shell */
.lesson-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:12px 16px;margin-bottom:12px}
.schoollogo{width:120px;height:auto;display:block}.lesson-head .schoollogo{width:64px;margin-left:auto}
@media (max-width:600px){.hero .schoollogo{position:absolute;top:10px;right:10px;width:64px}}
.lesson-head h2{font-size:clamp(22px,3vw,30px)}
.today{font-weight:800;color:var(--soft);font-size:15px}
.today b{color:var(--ink)}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.step{display:flex;align-items:center;gap:8px;border-radius:16px;padding:6px 12px 6px 6px;background:var(--paper);border:3px solid var(--line);font-weight:800;font-size:15px;opacity:.75}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ec);font-family:var(--display);font-size:16px}
.step .mins{font-size:12px;color:var(--soft);display:block;font-weight:700}
.step.now{border-color:var(--ec);opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--ec) 20%,transparent)}
.step.done{opacity:1}.step.done .n::after{content:"\2713"}.step.done .n span{display:none}
.card{background:var(--paper);border-radius:28px;border:3px solid var(--line);padding:20px;min-width:0;position:relative}
.estage-title{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.estage-title .badge{border-radius:999px;padding:4px 14px;color:#fff;font-family:var(--display);font-weight:800;font-size:20px;background:var(--ec)}
.task{font-size:20px;font-weight:800;margin:8px 0}
.next-row{display:flex;justify-content:flex-end;margin-top:14px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.split > *{min-width:0}

/* book page */
.bookwrap{margin:8px 0}.bookwrap>.label{display:table;margin:0 6px 8px auto;background:var(--bk,#5B6B8F);color:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:13px}
.bookwrap.lb{--bk:var(--e2)} .bookwrap.wb{--bk:#5B6B8F}
.book{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(29,43,79,.18),0 0 0 3px #fff,0 0 0 6px var(--bk,#5B6B8F);background:#fff;container-type:inline-size}
.book .sheet{position:absolute;left:0;width:100%}
.book img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.book.lb{--bk:var(--e2)} .book.wb{--bk:#5B6B8F}
.hw{position:absolute;display:flex;align-items:center;font-family:var(--hand);color:var(--pen);line-height:1;white-space:nowrap;pointer-events:none;clip-path:inset(0 100% 0 0);font-size:calc(var(--fs) * 1cqw)}
.hw.c{justify-content:center}
.hw.shown{clip-path:inset(0 0 0 0)}
.hw.go{animation:write 1.1s steps(16,end) forwards}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.shade{position:absolute;background:rgba(255,122,61,.62);mix-blend-mode:multiply;border-radius:2px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.shade.on{transform:scale(1)}
.hot{position:absolute;border-radius:10px;z-index:4}
.hot.hint{animation:hint 1.6s ease-in-out infinite}
@keyframes hint{0%,100%{box-shadow:0 0 0 0 rgba(122,76,224,0)}50%{box-shadow:0 0 0 4px rgba(122,76,224,.55)}}
.hot.picked{box-shadow:0 0 0 5px var(--star)!important;animation:none}
.hot.badtap{animation:badtap .5s}
@keyframes badtap{0%,100%{background:transparent}40%{background:rgba(229,72,77,.35)}}
.hot.used{background:rgba(255,255,255,.75);pointer-events:none;animation:none}
.marker{position:absolute;background:rgba(255,213,0,.45);mix-blend-mode:multiply;border-radius:6px;transform-origin:left;transform:scaleX(0);transition:transform .8s ease}
.marker.on{transform:scaleX(1)}
.book svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.book svg.lines line{stroke:var(--pen);stroke-width:7;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw .8s ease forwards}
.book svg.lines line.bad{stroke:var(--bad);stroke-dasharray:14 12;animation:none;opacity:.9}
@keyframes draw{to{stroke-dashoffset:0}}
.spark{position:absolute;z-index:6;pointer-events:none;font-size:22px;animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.pagebtn{display:block;width:100%;padding:0;text-align:left}

/* dots */
.dotstage{position:relative;margin:6px auto;transition:height .3s;touch-action:pan-y}
.dotstage.drag{touch-action:none;cursor:grab}
.dot{position:absolute;border-radius:50%;border:2px solid rgba(29,43,79,.55);transition:left .7s cubic-bezier(.4,1.4,.5,1),top .7s,opacity .5s,transform .5s}
.dot.B{cursor:grab}
.dotstage.dragging .dot.B{transition:none}
.dot.gone{opacity:0;transform:translateY(-40px) scale(.4)!important}
.dot.marked::after{content:"";position:absolute;inset:-6px;border:3px dashed var(--bad);border-radius:50%}
.dot.lonely{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,194,26,.9)}50%{box-shadow:0 0 0 10px rgba(255,194,26,0)}}
.dlabel{position:absolute;font-family:var(--display);font-weight:800;text-align:center;transition:opacity .4s,left .7s}
.glowbox{position:absolute;border:4px solid var(--even);border-radius:16px;box-shadow:0 0 0 6px rgba(47,123,245,.15),0 0 24px rgba(47,123,245,.45);opacity:0;transform:scale(1.15);transition:opacity .4s,transform .4s;pointer-events:none}
.glowbox.on{opacity:1;transform:scale(1)}
.draghint{position:absolute;font-weight:800;font-size:14px;color:var(--purple);white-space:nowrap;animation:nudge 1.2s ease-in-out infinite;pointer-events:none}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px)}}
.sdots{display:inline-grid;grid-auto-flow:column;grid-template-rows:repeat(2,var(--s,18px));gap:3px;vertical-align:middle}
.sdots b{width:var(--s,18px);height:var(--s,18px);border-radius:50%;border:1.5px solid rgba(29,43,79,.45);display:block}
.sdots b.lone{box-shadow:0 0 0 3px var(--star);animation:pulse 1s infinite}
.numdots{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.pairsblock{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:62px;min-height:40px;padding:4px 10px;border-radius:12px;border:2px dashed var(--even);color:var(--even-ink);font-family:var(--display);font-weight:800;font-size:20px;line-height:1;background:radial-gradient(circle,rgba(47,123,245,.28) 3px,transparent 4px) 0 0/12px 12px,#EEF4FF}
.pairsblock small{font-family:var(--body);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.plus{font-family:var(--display);font-weight:800;font-size:26px}
.test{background:#F4F8FE;border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin:8px 0;min-width:0}
.tests{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.tests .test{margin:0}
.rl{text-align:center;font-weight:800;font-size:17px;margin-top:2px}
.eqline{font-family:var(--display);font-size:26px;font-weight:800;text-align:center}
.chip{display:inline-block;border-radius:999px;padding:1px 12px;font-size:16px;font-weight:800;color:#fff;vertical-align:middle}
.chip.odd{background:var(--odd)}.chip.even{background:var(--even)}
.claim{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:800;margin:6px 0}

/* pairing towers (engage) */
.numpad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:520px;margin:10px auto}
.numpad button{height:62px;border-radius:16px;background:var(--paper);border:3px solid var(--line);font-family:var(--display);font-size:30px;font-weight:800}
.numpad button.odd{background:var(--odd);border-color:var(--odd-ink);color:#fff}
.numpad button.even{background:var(--even);border-color:var(--even-ink);color:#fff}
.pairs{display:flex;gap:10px;justify-content:center;align-items:flex-start;min-height:120px;flex-wrap:wrap;margin:10px 0}
.cap{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:999px;border:3px solid transparent;animation:capin .4s backwards}
.cap.full{border-color:rgba(47,123,245,.5);background:rgba(47,123,245,.08)}
.cap.alone{border-color:transparent}
.cap i{width:40px;height:40px;border-radius:50%;display:block;border:2px solid rgba(29,43,79,.5)}
.cap.alone i{animation:pulse 1s infinite}
@keyframes capin{from{transform:translateY(-30px) scale(.5);opacity:0}}
.verdict{text-align:center;font-family:var(--display);font-size:clamp(22px,3.2vw,30px);font-weight:800}

/* rule cards */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.flip{perspective:900px;min-height:260px}
.flip .in{position:relative;width:100%;height:100%;min-height:260px;transition:transform .7s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;background:var(--paper)}
.flip .f{background:linear-gradient(135deg,#7A4CE0,#2F7BF5);color:#fff;font-family:var(--display);font-size:32px;font-weight:800;cursor:pointer;border:0}
.flip .f small{font-family:var(--body);font-size:15px;opacity:.9}
.flip .b{transform:rotateY(180deg)}
.frame{background:#FFF8E1;border:3px solid #F2C94C;border-radius:18px;padding:12px 16px;font-size:clamp(19px,2.4vw,24px);font-weight:800;text-align:center}

/* thumbs */
.thumbs{display:flex;gap:16px;justify-content:center;margin:12px 0}
.thumb{width:130px;height:110px;border-radius:24px;font-size:56px;box-shadow:0 6px 0 rgba(29,43,79,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.thumb small{font-family:var(--display);font-weight:800;font-size:18px;color:#fff;margin-top:4px}
.thumb.up{background:var(--good)}.thumb.down{background:var(--bad)}
.bigstate{font-family:var(--display);font-size:clamp(28px,5vw,48px);font-weight:800;text-align:center;margin:10px 0}

/* who / stamps */
.who{display:flex;gap:14px;align-items:flex-start;margin:10px 0;position:relative}
.avatar{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:32px;color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px var(--line)}
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-size:clamp(19px,2.6vw,24px);font-weight:800;min-width:0}
.bubble::before{content:"";position:absolute;left:-14px;top:22px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble .name{display:block;font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.stamp{position:absolute;right:4%;top:50%;font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,34px);color:var(--bad);border:5px solid var(--bad);border-radius:12px;padding:2px 14px;transform:translateY(-50%) rotate(-10deg) scale(3);opacity:0;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .2s;background:rgba(255,255,255,.85);pointer-events:none}
.stamp.on{transform:translateY(-50%) rotate(-10deg) scale(1);opacity:1}

/* pascal */
.pascal{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
.prow{display:flex;gap:6px}
.pc{width:clamp(36px,6.4vw,54px);height:clamp(36px,6.4vw,54px);border-radius:50%;background:var(--paper);border:3px solid var(--line);font-family:var(--display);font-weight:800;font-size:clamp(15px,2.6vw,22px);transition:background .3s,transform .2s,border-color .3s}
.pc.ev{background:var(--even);border-color:var(--even-ink);color:#fff;transform:scale(1.05)}
.pc.od{background:var(--odd-soft);border-color:var(--odd)}
.pc.shake{animation:shake .4s}
.pc.parent{box-shadow:0 0 0 5px var(--star)}
.pc.kid{box-shadow:0 0 0 5px var(--purple)}
.pascal.reveal .pc.ev{animation:glow 1.2s ease-in-out 2}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(47,123,245,.35);transform:scale(1.15)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.found{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.found > span{border-radius:999px;padding:6px 14px;font-weight:800;border:3px dashed var(--line);color:var(--soft)}
.found > span.got{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--ink)}

/* cards game */
.pcards{display:flex;gap:18px;justify-content:center;align-items:center;margin:10px 0}
.pcard{width:118px;height:160px;perspective:800px}
.pcard .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.pcard.on .in{transform:rotateY(180deg)}
.pcard .f,.pcard .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:4px solid #fff;box-shadow:0 6px 16px rgba(29,43,79,.2)}
.pcard .f{background:repeating-linear-gradient(45deg,#7A4CE0 0 12px,#8E66E8 12px 24px)}
.pcard .b{transform:rotateY(180deg);background:var(--paper);font-family:var(--display);font-size:54px;font-weight:800;line-height:1}

/* feedback */
.fb{margin-top:12px;border-radius:18px;padding:12px 16px;font-size:18px;font-weight:700;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;animation:fbin .3s}
@keyframes fbin{from{transform:translateY(8px);opacity:0}}
.fb.good{background:var(--good-soft);border:3px solid var(--good)}.fb.bad{background:var(--bad-soft);border:3px solid var(--bad)}.fb.info{background:var(--purple-soft);border:3px solid var(--purple)}
