<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Times Tables Trainer</title><link rel="icon" type="image/png" href="../assets/favicon.png"><link rel="apple-touch-icon" href="../assets/insightia-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Times Tables Trainer: for Grade 2 and Grade 3, tables 1 to 10.
   Every table follows the same 4 steps:  See it (arrays + number line + a trick)  ->  Count it (skip-count song + fill the gaps)
   ->  Practise it (answer with help ready)  ->  Master it (quick check, no help).  A daily warm-up brings facts back (spaced practice)
   and the facts grid fills in as facts are mastered. 3 x 4 and 4 x 3 are the same fact, so 100 facts are only 55 to learn. */
:root{
  --bg:#EEF6FF;--paper:#fff;--ink:#1D2B4F;--soft:#5B6B8F;--line:#C9D8EE;
  --good:#1FA563;--good-soft:#DDF6E8;--bad:#E5484D;--bad-soft:#FFE3E3;--star:#FFC21A;--warm:#FFF4D6;
  --g2:#1FA563;--g3:#7A4CE0;--accent:#7A4CE0;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background-image:radial-gradient(circle at 14px 14px,rgba(122,76,224,.08) 2px,transparent 3px),radial-gradient(circle at 0 0,rgba(255,194,26,.12) 2px,transparent 3px);background-size:28px 28px,56px 56px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-block:16px 70px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.center{justify-content:center}
.sub{color:var(--soft);font-size:16px;margin:0;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px;color:var(--ink);text-decoration:none}
.pill:hover{border-color:var(--accent)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar .grow{flex:1}
.big{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:58px;min-width:100px;padding:8px 22px;border-radius:18px;font-family:var(--display);font-weight:800;font-size:23px;border:3px solid transparent;box-shadow:0 5px 0 rgba(29,43,79,.2);transition:transform .08s;background:var(--tc,var(--accent));color:#fff}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(29,43,79,.2)}
.big.plain{background:var(--paper);border-color:var(--line);color:var(--ink)}
.big.go{background:var(--good)}
.big.small{min-height:46px;font-size:19px;padding:4px 16px;min-width:0}
.big[disabled]{opacity:.4;pointer-events:none}
.card{background:var(--paper);border-radius:28px;border:3px solid var(--line);padding:20px;min-width:0;position:relative}
.wmark{display:table;margin:10px auto 24px;background:rgba(255,255,255,.9);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;color:var(--soft)}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;background:var(--paper);border-radius:30px;padding:20px 24px;border:3px solid var(--line);position:relative;overflow:hidden;margin-top:12px}
.hero h1{font-size:clamp(32px,5.6vw,56px);font-weight:800}
.tag{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.schoollogo{width:110px;height:auto;display:block}
.mascot{flex:none;width:80px;height:80px;animation:bob 2.4s ease-in-out infinite}
.mascot.huge{width:110px;height:110px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.gradepick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.gradepick button{border-radius:999px;padding:6px 16px;font-weight:800;font-size:17px;border:3px solid var(--line);background:var(--paper)}
.gradepick button.on{color:#fff;border-color:transparent}
.gradepick .g2.on{background:var(--g2)}.gradepick .g3.on{background:var(--g3)}

/* home */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:16px 0}
.qcard{display:flex;gap:14px;align-items:center;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 6px 0 rgba(29,43,79,.07);transition:transform .15s,border-color .15s}
.qcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.qcard .ic{flex:none;width:66px;height:66px;border-radius:20px;display:grid;place-items:center;font-size:36px;background:var(--warm)}
.qcard h2{font-size:24px}.qcard p{margin:2px 0 0;color:var(--soft);font-weight:700;font-size:15px}
.sec{font-family:var(--display);font-weight:800;font-size:26px;margin:22px 0 4px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px 12px;border-radius:24px;background:var(--tc);color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .15s;overflow:hidden}
.tile:hover{transform:translateY(-3px) scale(1.02)}
.tile:active{transform:translateY(4px)}
.tile::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.13);right:-40px;top:-46px}
.tile .x{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.tile .nm{font-weight:800;font-size:16px}
.tile .order{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.25);border-radius:999px;padding:0 9px;font-size:13px;font-weight:800}
.tile .dots{display:flex;gap:5px;margin-top:2px}
.tile .dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.7)}
.tile .dots i.on{background:var(--star);border-color:#fff}
.tile .mbar{width:80%;height:10px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.tile .mbar b{display:block;height:100%;background:#fff;border-radius:99px}
.tile .crown{position:absolute;right:10px;top:6px;font-size:26px;z-index:1}
.teacher{margin-top:26px}
.teacher summary{cursor:pointer;font-weight:800;font-size:18px;padding:12px 16px;background:var(--paper);border:3px solid var(--line);border-radius:20px}
.teacher[open] summary{border-radius:20px 20px 0 0}
.teacher .tbody{background:var(--paper);border:3px solid var(--line);border-top:0;border-radius:0 0 20px 20px;padding:4px 20px 16px;font-size:16px}
.teacher li{margin:6px 0}

/* guide speech */
.guide{display:flex;gap:12px;align-items:flex-start;margin:6px 0 12px}
.say{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-size:clamp(19px,2.4vw,23px);font-weight:800;min-width:0;flex:1;max-width:800px}
.say::before{content:"";position:absolute;left:-14px;top:22px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}
.say .spk{float:right;margin:-4px -6px 4px 8px;width:42px;height:42px;border-radius:50%;background:var(--warm);font-size:20px}

/* table page */
.thead{display:flex;gap:14px;align-items:center;background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:12px 16px;margin-bottom:12px}
.thead>div{min-width:0}.thead .badge{flex:none;width:64px;height:64px;border-radius:18px;background:var(--tc);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:30px}
.thead h2{font-size:clamp(24px,3.4vw,32px)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.fchip{border-radius:14px;padding:4px 10px;font-weight:800;font-size:16px;border:2px solid var(--line);background:#F6F8FC;color:var(--soft)}
.fchip.b1{background:#FFF1C2;border-color:#F2C94C;color:var(--ink)}
.fchip.b2{background:#D9F2E3;border-color:#7FD3A4;color:var(--ink)}
.fchip.b3{background:var(--good);border-color:var(--good);color:#fff}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.stepc{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:16px;transition:transform .15s,border-color .15s;position:relative}
.stepc:hover{transform:translateY(-3px);border-color:var(--tc)}
.stepc .sn{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--tc);text-transform:uppercase;font-size:14px;letter-spacing:.06em}
.stepc .sn b{width:30px;height:30px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:17px}
.stepc h3{font-size:26px}.stepc p{margin:0;color:var(--soft);font-weight:700;font-size:15px}
.stepc .em{font-size:40px;position:absolute;right:14px;top:10px}
.stepc .done{color:var(--good);font-weight:800}
.stepc.next{border-color:var(--tc);box-shadow:0 0 0 5px color-mix(in srgb,var(--tc) 22%,transparent)}
.stepc .nexttag{background:var(--tc);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:800}
.knew{margin-top:12px;background:var(--good-soft);border:2px solid #9ED9B8;border-radius:18px;padding:10px 14px;font-weight:700;font-size:16px}

/* arrays */
.arr{display:inline-flex;flex-direction:column;gap:var(--gap);padding:12px;border-radius:20px;background:#F7FAFF;border:2px dashed var(--line)}
.arow{display:flex;align-items:center;gap:var(--gap)}
.dot{width:var(--d);height:var(--d);border-radius:50%;background:var(--dc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);flex:none}
.dot.alt{background:var(--dc2)}
.arow .sk{min-width:40px;margin-left:8px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--dc)}
.arow.pop .dot{animation:pop .35s ease-out backwards}
.arow.pop .dot:nth-child(2){animation-delay:.03s}.arow.pop .dot:nth-child(3){animation-delay:.06s}.arow.pop .dot:nth-child(4){animation-delay:.09s}.arow.pop .dot:nth-child(5){animation-delay:.12s}
.arow.pop .dot:nth-child(6){animation-delay:.15s}.arow.pop .dot:nth-child(7){animation-delay:.18s}.arow.pop .dot:nth-child(8){animation-delay:.21s}.arow.pop .dot:nth-child(9){animation-delay:.24s}.arow.pop .dot:nth-child(10){animation-delay:.27s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.spin{animation:spin .5s ease-out}
@keyframes spin{0%{transform:rotate(-90deg) scale(.6);opacity:.3}100%{transform:none;opacity:1}}
.eq{font-family:var(--display);font-weight:800;font-size:clamp(38px,7vw,64px);line-height:1.05;text-align:center}
.eq .q{display:inline-block;min-width:1.6em;padding:0 .2em;border-radius:16px;border:4px dashed var(--tc);color:var(--tc);background:#fff}
.eq .q.ok{border-style:solid;background:var(--good-soft);color:var(--good);border-color:var(--good)}
.eq .q.no{border-style:solid;background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.words{text-align:center;font-weight:800;color:var(--soft);font-size:19px}
.seegrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.seegrid .left{display:flex;flex-direction:column;align-items:center;gap:12px}
.nl{width:100%;height:auto;display:block}
.trick{background:var(--warm);border:3px solid #F2C94C;border-radius:24px;padding:16px}
.trick h3{font-size:24px;margin-bottom:4px}
.trick p{margin:4px 0;font-weight:700}
.kpick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kpick button{width:42px;height:42px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:18px}
.kpick button.on{background:var(--tc);border-color:var(--tc);color:#fff}
.demo{background:#fff;border-radius:18px;padding:12px;margin-top:8px;font-weight:800;font-size:20px;text-align:center}
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-family:var(--display);font-size:26px}
.chain .bx{background:var(--tc);color:#fff;border-radius:14px;padding:2px 14px;min-width:54px;text-align:center}
.chain .ar{color:var(--soft);font-size:16px;font-family:var(--body);font-weight:800;text-align:center;line-height:1.1}
.hands{display:flex;justify-content:center;gap:18px;align-items:flex-end;margin:6px 0}
.hand{display:flex;gap:5px;align-items:flex-end}
.fing{width:22px;border-radius:11px 11px 6px 6px;background:#FFD2B0;border:2px solid #D9946A;position:relative;display:flex;flex-direction:column}
.fing.down{background:#E3E8F0;border-color:#B8C2D3}
.fing .seg{flex:1;border-bottom:2px solid #D9946A}.fing .seg:last-child{border-bottom:0}
.fing .seg.lit{background:var(--tc)}
.fing small{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--soft)}
.pv{display:inline-grid;grid-template-columns:repeat(3,60px);gap:4px;margin:6px auto}
.pv div{border-radius:10px;padding:2px 0;text-align:center}
.pv .h{background:#EEF2F8;font-size:14px}.pv .v{background:#fff;border:2px solid var(--line);font-family:var(--display);font-size:30px}
.pv .v.new{background:var(--warm);border-color:#F2C94C}

/* count step */
.hsq{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:460px;width:100%;margin:0 auto}
.hsq div{aspect-ratio:1;border-radius:8px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:clamp(11px,2.6vw,17px);color:#9AA7C0;transition:background .2s,transform .2s}
.hsq div.mul{color:var(--ink);border-color:var(--tc)}
.hsq div.lit{background:var(--tc);color:#fff;border-color:var(--tc);transform:scale(1.08)}
.bubbles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.bub{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;background:var(--tc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.bub.gap{background:#fff;color:var(--soft);border:3px dashed var(--line);box-shadow:none}
.bub.now{border-color:var(--tc);color:var(--tc);animation:pulse 1s ease-in-out infinite}
.bub.filled{animation:pop .35s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.jump{font-weight:800;color:var(--soft);text-align:center;min-height:28px}

/* questions */
.qwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog i{width:26px;height:26px;border-radius:50%;background:#E3EAF5;display:grid;place-items:center;font-style:normal;font-size:14px;color:#fff;font-weight:800}
.prog i.ok{background:var(--good)}.prog i.no{background:var(--bad)}.prog i.now{outline:3px solid var(--tc);outline-offset:2px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(120px,170px));gap:12px;justify-content:center}
.opt{min-height:72px;border-radius:20px;background:#fff;border:3px solid var(--line);font-family:var(--display);font-weight:800;font-size:36px;box-shadow:0 5px 0 var(--line)}
.opt:hover{border-color:var(--tc)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px;justify-content:center}
.pad button{height:64px;border-radius:18px;background:#fff;border:3px solid var(--line);font-family:var(--display);font-weight:800;font-size:30px;box-shadow:0 4px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .ok{background:var(--good);border-color:var(--good);color:#fff;box-shadow:0 4px 0 #14804B}
.pad .del{font-size:24px}
.help{display:flex;flex-direction:column;align-items:center;gap:8px;background:#F7FAFF;border:2px solid var(--line);border-radius:20px;padding:12px;max-width:100%}
.fix{background:var(--warm);border:3px solid #F2C94C;border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:100%}
.fix p{margin:0;font-weight:800;text-align:center}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.result .stars{font-size:54px;letter-spacing:6px}
.st-on{color:var(--star)}.st-off{color:#D5DEEC}

/* facts grid */
.gridwrap{overflow-x:auto;padding-bottom:4px}
.fg{border-collapse:separate;border-spacing:3px;margin:0 auto}
.fg th,.fg td{width:min(52px,calc((100vw - 118px)/11));height:min(52px,calc((100vw - 118px)/11));border-radius:10px;text-align:center;font-weight:800;font-size:clamp(11px,2.4vw,18px);padding:0}
.fg th{color:#fff;font-family:var(--display);font-size:clamp(14px,3vw,22px)}
.fg th.corner{background:var(--ink)}
.fg td button{width:100%;height:100%;padding:0;min-width:0;font-size:inherit;border-radius:10px;font-weight:800;border:2px solid var(--line);background:#F6F8FC;color:#B4BFD3}
.fg td button.b1{background:#FFF1C2;border-color:#F2C94C;color:var(--ink)}
.fg td button.b2{background:#D9F2E3;border-color:#7FD3A4;color:var(--ink)}
.fg td button.b3{background:var(--good);border-color:var(--good);color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:15px;margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:inline-block}
.bigcount{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);text-align:center}
.modal{position:fixed;inset:0;background:rgba(29,43,79,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:560px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti span{position:absolute;top:-40px;font-size:30px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

@media (max-width:760px){.seegrid{grid-template-columns:1fr}}
@media (max-width:600px){
  .hero{grid-template-columns:auto 1fr;padding:16px}.hero .schoollogo{position:absolute;top:10px;right:10px;width:58px}
  .hero .mascot{width:64px;height:64px}
  .tables{grid-template-columns:repeat(2,1fr)}
  .tile .x{font-size:46px}
  .bub{width:52px;height:52px;font-size:22px}
  .pad{grid-template-columns:repeat(3,70px)}
  .card{padding:14px}
  .arow .sk{min-width:32px;font-size:17px;margin-left:4px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>
<div class="wrap" id="app"></div>
<div class="wmark">© Teacher Dima Abuhaifa</div>
<script>
(function(){
"use strict";
var app=document.getElementById('app');

/* ---------- the ten tables ---------- */
var ORDER=[1,10,2,5,3,4,8,6,9,7];          /* easiest first, each new table leans on ones already learnt */
var COL={1:'#E0559B',2:'#2F7BF5',3:'#0E9AAE',4:'#1FA563',5:'#FF7A3D',6:'#E5484D',7:'#8D5A2B',8:'#C98A00',9:'#3949AB',10:'#7A4CE0'};
var STEPS=[
  {id:'see',n:1,em:'👀',t:'See it',d:'Build it with dots and jumps. Learn a magic trick.'},
  {id:'count',n:2,em:'🎵',t:'Count it',d:'Sing the skip-count, then fill the gaps.'},
  {id:'practise',n:3,em:'✏️',t:'Practise it',d:'Answer the facts. Help is always ready.'},
  {id:'master',n:4,em:'🏆',t:'Master it',d:'Quick check with no help. Earn your stars!'}
];

/* ---------- saved progress (this device only) ---------- */
var STORE='timesTablesTrainer.v1';
var SAVE={};try{SAVE=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch(e){SAVE={}}
SAVE.p=SAVE.p||{};
